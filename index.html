<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<title>UFL Inden Monitor</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.outer-frame{min-height:100vh;border:10px solid #0f172a}
button,input,textarea,select{border-width:5px!important}
input[type=range]{border-width:0!important;accent-color:#2563eb}
.unit-grid{display:grid;grid-template-columns:1.2fr 1.15fr 1.25fr .85fr .85fr;gap:12px;align-items:center}
.status{font-weight:900;font-size:.78rem;line-height:1rem;overflow-wrap:anywhere;border:5px solid}
.ready-card{position:relative;border:5px solid #22c55e!important;transform:translateY(-3px);box-shadow:0 0 0 3px #22c55e33,0 11px 0 #15803d,0 17px 25px #15803d59,0 0 18px #22c55ecc;animation:pulseGreen 2.3s ease-in-out infinite;transition:.25s}
.ready-card:hover{transform:translateY(-7px)}
.ready-card:after{content:"READY";position:absolute;top:-18px;right:20px;padding:3px 10px;border-radius:999px;color:#052e16;background:#bbf7d0;border:5px solid #22c55e;box-shadow:0 0 14px #22c55ecc;font-size:.65rem;font-weight:900}
.notification{border:5px solid #facc15!important;border-left-width:9px!important;transition:.25s}
.notification:hover{transform:translateX(3px)}
.flow{color:#94a3b8;font-weight:900}.tick{color:#16a34a;font-size:1.4em;font-weight:1000}.cross{color:#dc2626;font-size:1.4em;font-weight:1000}
.slide{animation:slideUp .3s ease both}
@keyframes slideUp{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes pulseGreen{0%,100%{box-shadow:0 0 0 3px #22c55e2e,0 11px 0 #15803d,0 16px 23px #15803d4d,0 0 14px #22c55e9e}50%{box-shadow:0 0 0 5px #22c55e5c,0 14px 0 #166534,0 22px 32px #15803d73,0 0 34px #22c5,0 0 68px #22c55e80}}
@media(max-width:1279px){.unit-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.unit-header{display:none}.unit-grid:not(.unit-header)>:first-child{grid-column:1/-1}}
@media(max-width:1023px){.dashboard{display:flex!important;flex-direction:column}.main,.side{display:contents}.dashboard-card{order:1}.notifications{order:2}.units{order:3}.settings{order:0}.error{order:4}}
@media(max-width:640px){.unit-grid{gap:10px;padding:14px!important}.ready-card:after{right:14px;font-size:.58rem}}
</style>
</head>
<body class="bg-slate-100 text-slate-900">
<div id="app"></div>
<script>
const DEFAULT_SHEET_URL="https://docs.google.com/spreadsheets/d/1m6D6POkxoEGPr0n8X4N2xv3nC5j0rxvsML02tGkK1to/edit?gid=0#gid=0";
const READY="Sedia Diambil",PROCESSING="Sedang Diproses",RECEIVED="Baru Diterima",HIDDEN="Inden Belum Diterima";
const LEGACY={"Inden Sedia Diambil":READY,"Inden Sedang Diproses":PROCESSING,"Inden Baru Diterima":RECEIVED};
const LIGHT={bg:"#f8fafc",surface:"#fff",ink:"#0f172a",muted:"#64748b",border:"#e2e8f0",accent:"#2563eb",purple:"#7c3aed",green:"#16a34a",red:"#dc2626",redSoft:"#fee2e2",amber:"#d97706",header:"#0f172a",input:"#fff"};
const DARK={bg:"#0f172a",surface:"#1e293b",ink:"#f1f5f9",muted:"#94a3b8",border:"#334155",accent:"#3b82f6",purple:"#a78bfa",green:"#22c55e",red:"#ef4444",redSoft:"#450a0a",amber:"#f59e0b",header:"#020617",input:"#0f172a"};
const TXT={
en:{tracker:"Realtime status tracker",settings:"Settings",dashboard:"Dashboard Status Inden",last:"Last updated",refresh:"Refresh",refreshing:"Refreshing...",total:"Total Unit",ready:"Ready",processing:"Processing",received:"New Received",notifications:"Notifications",live:"Live unit status changes are displayed automatically",current:"Current status",changed:"Status changed",units:"Units",unit:"Unit",drip:"Drip",nonmed:"Bukan Ubat",carts:"Total Carts",need:"Need Cart",sheet:"Google Sheet URL",script:"Script URL",save:"Save & Reload",error:"Error",noData:"No data loaded yet.",noChanges:"No active status changes.",noStatus:"No status",inden:"Inden",enable:"Enable OS notifications",enabled:"OS notifications enabled",blocked:"Notifications blocked in browser settings",soundOn:"Sound on",soundOff:"Sound off",volume:"Chime volume",testSound:"Test chime",chime:"Chime sound",classic:"Classic",bright:"Bright",soft:"Soft",alert:"Alert"},
ms:{tracker:"Pengesan status semasa",settings:"Aturan",dashboard:"Papan Pemuka Status Inden",last:"Terakhir kemaskini",refresh:"Muat Semula",refreshing:"Mengemaskini...",total:"Jumlah Unit",ready:"Sedia",processing:"Proses",received:"Baru Diterima",notifications:"Pemberitahuan",live:"Perubahan status Unit dipaparkan secara automatik",current:"Status semasa",changed:"Status berubah",units:"Unit",unit:"Unit",drip:"Drip",nonmed:"Bukan Ubat",carts:"Jumlah Troli",need:"Perlu Troli",sheet:"URL Google Sheet",script:"URL Skrip",save:"Simpan & Muatkan",error:"Ralat",noData:"Tiada data dimuatkan lagi.",noChanges:"Tiada perubahan status aktif.",noStatus:"Tiada status",inden:"Inden",enable:"Aktifkan pemberitahuan OS",enabled:"Pemberitahuan OS aktif",blocked:"Pemberitahuan disekat dalam tetapan pelayar",soundOn:"Bunyi aktif",soundOff:"Bunyi dimatikan",volume:"Tahap bunyi chime",testSound:"Uji chime",chime:"Bunyi chime",classic:"Klasik",bright:"Terang",soft:"Lembut",alert:"Amaran"}};
const CHIMES={
classic:[{time:0,freq:523.25,duration:.42},{time:.13,freq:659.25,duration:.42},{time:.26,freq:783.99,duration:.62}],
bright:[{time:0,freq:659.25,duration:.3},{time:.12,freq:880,duration:.3},{time:.24,freq:1046.5,duration:.5}],
soft:[{time:0,freq:392,duration:.55},{time:.2,freq:493.88,duration:.55},{time:.4,freq:587.33,duration:.8}],
alert:[{time:0,freq:880,duration:.25},{time:.2,freq:659.25,duration:.25},{time:.4,freq:880,duration:.45}]
};
const state={
units:{},previous:{},notifications:[],sheetUrl:localStorage.getItem("ufl-sheet-url")||DEFAULT_SHEET_URL,
scriptUrl:localStorage.getItem("ufl-script-url")||"",theme:localStorage.getItem("ufl-theme")||"light",
sound:localStorage.getItem("ufl-sound")!=="off",volume:Math.max(0,Math.min(100,Number(localStorage.getItem("ufl-volume")??65))),
chime:localStorage.getItem("ufl-chime")||"classic",loading:false,error:"",lastUpdated:new Date(),
settings:false,ms:false,initialized:false,permission:typeof Notification==="undefined"?"unsupported":Notification.permission
};
let audioContext=null;
const t=k=>TXT[state.ms?"ms":"en"][k],colors=()=>state.theme==="dark"?DARK:LIGHT;
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const normalize=v=>LEGACY[String(v||"").trim()]||String(v||"").trim();
const valid=[READY,PROCESSING,RECEIVED,HIDDEN];
function statusColor(s){const c=colors();return s===READY?c.green:s===PROCESSING?c.amber:s===RECEIVED?c.accent:c.muted}
function label(s){if(!state.ms)return s;return s===READY?"Sedia Diambil":s===PROCESSING?"Sedang Diproses":s===RECEIVED?"Baru Diterima":"Inden Belum Diterima"}
function badge(status){status=normalize(status);if(!status)return "";let ready=status===READY;return `<span class="status inline-flex items-center gap-1 px-2.5 py-1.5 rounded-xl ${ready?"text-green-950":"text-white"}" style="background:${ready?"#bbf7d0":statusColor(status)};border-color:${ready?"#86efac":statusColor(status)}">${ready?"✅ ":""}${esc(label(status))}</span>`}
function normalizeTroli(v){return["ya","yes","true","1","✓","✔"].includes(String(v??"").trim().toLowerCase())?"✓":"X"}
function parseCSV(text){const rows=[];let row=[],cell="",quoted=false;for(let i=0;i<text.length;i++){let ch=text[i];if(quoted){if(ch==='"'&&text[i+1]==='"'){cell+='"';i++}else if(ch==='"')quoted=false;else cell+=ch}else if(ch==='"')quoted=true;else if(ch===","){row.push(cell.trim());cell=""}else if(ch==="\n"){row.push(cell.trim());rows.push(row);row=[];cell=""}else if(ch!=="\r")cell+=ch}if(cell||row.length){row.push(cell.trim());rows.push(row)}return rows}
function csvUrl(url){let m=String(url||"").match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);if(!m)return "";try{let p=new URL(url),gid=p.searchParams.get("gid")||"0";return`https://docs.google.com/spreadsheets/d/${m[1]}/export?format=csv&gid=${encodeURIComponent(gid)}`}catch{return""}}
function playNotificationSound(){
 if(!state.sound||state.volume<=0)return;
 try{
  audioContext=audioContext||new(window.AudioContext||window.webkitAudioContext)();
  if(audioContext.state==="suspended")audioContext.resume();
  const now=audioContext.currentTime,level=state.volume/100;
  (CHIMES[state.chime]||CHIMES.classic).forEach((note,index)=>{
   const o=audioContext.createOscillator(),g=audioContext.createGain(),f=audioContext.createBiquadFilter(),start=now+note.time;
   o.type=state.chime==="bright"?"triangle":state.chime==="alert"?"square":index===2?"sine":"triangle";
   o.frequency.setValueAtTime(note.freq,start);o.frequency.exponentialRampToValueAtTime(note.freq*1.015,start+note.duration);
   f.type="lowpass";f.frequency.setValueAtTime(state.chime==="soft"?1800:2800,start);
   g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime((index===2?.2:.14)*level,start+.025);
   g.gain.exponentialRampToValueAtTime(.0001,start+note.duration);
   o.connect(f);f.connect(g);g.connect(audioContext.destination);o.start(start);o.stop(start+note.duration+.03);
  });
 }catch{}
}
function toggleSound(){state.sound=!state.sound;localStorage.setItem("ufl-sound",state.sound?"on":"off");if(state.sound)playNotificationSound();render()}
function setVolume(value,test=false){state.volume=Math.max(0,Math.min(100,Number(value)||0));localStorage.setItem("ufl-volume",state.volume);let o=document.getElementById("volumeValue");if(o)o.textContent=state.volume+"%";if(test)playNotificationSound()}
function setChime(value,test=false){state.chime=CHIMES[value]?value:"classic";localStorage.setItem("ufl-chime",state.chime);if(test)playNotificationSound()}
function notify(unit,category,oldStatus,newStatus){playNotificationSound();if(state.permission!=="granted")return;try{new Notification(`UFL Inden: ${unit}`,{body:`${category==="drip"?"Drip":"Bukan Ubat"}: ${label(oldStatus)} → ${label(newStatus)}`,tag:`ufl-${unit}-${category}`})}catch{}}
function addNotification(unit,category,oldStatus,newStatus,initial=false){const key=`${unit}-${category}`;state.notifications=state.notifications.filter(n=>n.key!==key);if(normalize(newStatus)===HIDDEN)return;state.notifications.unshift({key,unit,category,old:oldStatus||"—",now:newStatus,initial,time:new Date().toLocaleTimeString(),timestamp:Date.now()});state.notifications=state.notifications.slice(0,30);if(!initial){notify(unit,category,oldStatus,newStatus);setTimeout(()=>{state.notifications=state.notifications.filter(n=>n.key!==key);render()},7000)}}
async function enableNotifications(){if(typeof Notification==="undefined"){alert("This browser does not support OS notifications.");return}state.permission=await Notification.requestPermission();render()}
async function fetchData(){
 if(state.loading)return;state.loading=true;state.error="";render();
 try{
  let result=null;
  if(state.scriptUrl.trim())try{let r=await fetch(state.scriptUrl.trim());if(r.ok){let p=await r.json();result=p.data||p}}catch{}
  if(!result){let url=csvUrl(state.sheetUrl);if(!url)throw Error("URL Google Sheet tidak sah.");let r=await fetch(url);if(!r.ok)throw Error("Gagal membaca Google Sheet. Pastikan sheet boleh diakses secara umum.");result={};parseCSV(await r.text()).forEach(row=>{let unit=(row[0]||"").trim(),drip=normalize(row[1]),nonmed=normalize(row[2]);if(unit&&unit.toLowerCase()!=="unit"&&(valid.includes(drip)||valid.includes(nonmed)))result[unit]={drip:{status:drip},bukanUbat:{status:nonmed},jumlahTroli:parseInt(row[3],10)||0,perluTroli:normalizeTroli(row[4])}})}
  let current={};
  Object.entries(result||{}).forEach(([unit,data])=>{data.drip=data.drip||{};data.bukanUbat=data.bukanUbat||{};data.drip.status=normalize(data.drip.status);data.bukanUbat.status=normalize(data.bukanUbat.status);data.perluTroli=normalizeTroli(data.perluTroli);["drip","bukanUbat"].forEach(category=>{let now=data[category].status||HIDDEN,key=`${unit}-${category}`,old=state.previous[key];current[key]=now;if(old!==undefined&&old!==now)addNotification(unit,category,old,now);else if(!state.initialized&&old===undefined&&now!==HIDDEN)addNotification(unit,category,"",now,true)})});
  state.previous=current;state.units=Object.fromEntries(Object.entries(result||{}).filter(([,u])=>!(u.drip?.status===HIDDEN&&u.bukanUbat?.status===HIDDEN)));state.initialized=true;state.lastUpdated=new Date()
 }catch(e){state.error=e.message||"Ralat berlaku semasa memuatkan data."}
 state.loading=false;render()
}
function toggleTheme(){state.theme=state.theme==="light"?"dark":"light";localStorage.setItem("ufl-theme",state.theme);render()}
function toggleLanguage(){state.ms=!state.ms;document.documentElement.lang=state.ms?"ms":"en";render()}
function toggleSettings(){state.settings=!state.settings;render()}
function saveSettings(){state.sheetUrl=document.getElementById("sheetUrl")?.value.trim()||DEFAULT_SHEET_URL;state.scriptUrl=document.getElementById("scriptUrl")?.value.trim()||"";localStorage.setItem("ufl-sheet-url",state.sheetUrl);localStorage.setItem("ufl-script-url",state.scriptUrl);state.settings=false;fetchData()}
function renderNotifications(c){
 let notes=state.notifications.slice().sort((a,b)=>b.timestamp-a.timestamp).slice(0,8);
 return `<section class="notifications rounded-3xl p-6 border shadow-sm slide" style="background:${c.surface};border-color:#facc15;box-shadow:0 0 18px #facc1580"><div class="flex justify-between items-center mb-2"><h3 class="font-bold text-lg">🟡 ${t("notifications")}</h3><span class="text-xs font-bold px-2 py-1 rounded-full bg-yellow-300 text-yellow-950">${state.notifications.length}</span></div><p class="text-xs mb-4" style="color:${c.muted}">${t("live")}</p><div class="rounded-2xl p-3 mb-4 border text-xs font-bold leading-6" style="background:${c.bg};border-color:#facc158c">${label(HIDDEN)} <span class="flow">→</span> ${label(RECEIVED)} <span class="flow">→</span> ${label(PROCESSING)} <span class="flow">→</span> ${label(READY)}</div>${notes.map(n=>`<div class="notification rounded-2xl p-4 mb-3 slide" style="background:${c.bg}"><div class="flex justify-between gap-3"><div><b>${esc(n.unit)}</b><div class="text-xs mt-1 font-semibold" style="color:${c.muted}">${n.category==="drip"?"💧 Drip":"💉 "+t("nonmed")}</div></div><small style="color:${c.muted}">${esc(n.time)}</small></div><div class="text-sm mt-3">${n.initial?`<span style="color:${c.muted}">${t("current")}:</span><div class="mt-2">${badge(n.now)}</div>`:`<div class="text-xs font-semibold mb-2" style="color:${c.muted}">${t("changed")}</div><div class="flex flex-wrap items-center gap-1">${badge(n.old)} <span class="flow">→</span> ${badge(n.now)}</div>`}</div></div>`).join("")||`<div class="text-sm" style="color:${c.muted}">${t("noChanges")}</div>`}</section>`
}
function render(){
 const c=colors(),items=Object.entries(state.units).sort(([a],[b])=>String(a).localeCompare(String(b),undefined,{numeric:true,sensitivity:"base"})),total=items.length,count=s=>items.filter(([,u])=>u.drip?.status===s||u.bukanUbat?.status===s).length;
 document.body.style.background=c.bg;document.body.style.color=c.ink;
 const notificationControl=state.permission==="granted"?`<span class="px-3 py-2 rounded-xl bg-green-500 text-white text-xs font-bold">🔔 ${t("enabled")}</span>`:state.permission==="denied"?`<span class="px-3 py-2 rounded-xl bg-red-500 text-white text-xs font-bold">🔕 ${t("blocked")}</span>`:`<button onclick="enableNotifications()" class="px-3 py-2 rounded-xl bg-yellow-400 text-yellow-950 font-bold">🔔 <span class="hidden sm:inline">${t("enable")}</span></button>`;
 const settings=state.settings?`<section class="settings rounded-3xl p-6 border shadow-sm slide" style="background:${c.surface};border-color:${c.border}"><div class="flex justify-between items-center mb-4"><h3 class="font-bold text-lg">${t("settings")}</h3><button onclick="toggleSettings()">✕</button></div><label class="text-sm font-semibold">${t("sheet")}</label><textarea id="sheetUrl" rows="4" class="w-full mt-2 rounded-2xl px-4 py-3 border" style="background:${c.input};color:${c.ink};border-color:${c.border}">${esc(state.sheetUrl)}</textarea><label class="text-sm font-semibold block mt-4">${t("script")}</label><input id="scriptUrl" value="${esc(state.scriptUrl)}" class="w-full mt-2 rounded-2xl px-4 py-3 border" style="background:${c.input};color:${c.ink};border-color:${c.border}"><div class="mt-6 p-4 rounded-2xl border" style="background:${c.bg};border-color:${c.border}"><label class="text-sm font-bold">🎵 ${t("chime")}</label><select id="chimeSelect" onchange="setChime(this.value)" class="w-full mt-2 rounded-xl px-3 py-2 border font-semibold" style="background:${c.input};color:${c.ink};border-color:${c.border}">${Object.keys(CHIMES).map(x=>`<option value="${x}" ${state.chime===x?"selected":""}>${t(x)}</option>`).join("")}</select><div class="flex justify-between items-center mt-5 mb-2"><label class="text-sm font-bold">🔊 ${t("volume")}</label><output id="volumeValue" class="font-black text-blue-600">${state.volume}%</output></div><input id="volumeRange" type="range" min="0" max="100" step="1" value="${state.volume}" oninput="setVolume(this.value)" class="w-full h-3 cursor-pointer"><div class="flex justify-between text-xs mt-1" style="color:${c.muted}"><span>0%</span><span>100%</span></div><button onclick="setVolume(document.getElementById('volumeRange').value,true)" class="w-full mt-3 px-3 py-2 rounded-xl font-bold" style="background:${c.surface};border:2px solid ${c.border}">${t("testSound")}</button></div><button onclick="saveSettings()" class="w-full mt-4 px-4 py-3 rounded-2xl text-white font-semibold" style="background:${c.green}">${t("save")}</button></section>`:"";
 document.getElementById("app").innerHTML=`<div class="outer-frame"><header class="sticky top-0 z-40 border-b" style="background:${c.header};border-color:${c.border}"><div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 min-h-16 py-2 flex items-center justify-between gap-3"><div class="flex items-center gap-3 min-w-0"><div class="w-10 h-10 rounded-2xl flex items-center justify-center text-white font-black" style="background:linear-gradient(135deg,${c.accent},${c.purple})">UFL</div><div><b class="text-white block">UFL Inden Monitor</b><div class="text-xs text-slate-300">${t("tracker")}</div></div></div><div class="flex gap-2 items-center flex-wrap justify-end">${notificationControl}<button onclick="toggleSound()" class="px-3 py-2 rounded-xl font-bold ${state.sound?"bg-cyan-400 text-cyan-950":"bg-slate-500 text-white"}">${state.sound?"🔊":"🔇"} <span class="hidden sm:inline">${state.sound?t("soundOn"):t("soundOff")}</span></button><button onclick="toggleLanguage()" class="px-3 py-2 rounded-xl bg-emerald-500 text-white font-bold">MS</button><button onclick="toggleTheme()" class="px-3 py-2 rounded-xl font-semibold" style="background:${c.surface};color:${c.ink}">${state.theme==="light"?"🌙":"☀️"} <span class="hidden sm:inline">${state.theme==="light"?"Dark":"Light"}</span></button><button onclick="toggleSettings()" class="px-3 py-2 rounded-xl text-white font-semibold" style="background:${c.accent}">⚙️ <span class="hidden sm:inline">${t("settings")}</span></button></div></div></header><main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6"><div class="dashboard grid lg:grid-cols-12 gap-6"><div class="main lg:col-span-8 space-y-6"><section class="dashboard-card rounded-3xl p-6 border shadow-sm" style="background:${c.surface};border-color:${c.border}"><div class="flex flex-wrap justify-between items-start gap-4"><div><h1 class="text-2xl font-extrabold">${t("dashboard")}</h1><p class="text-sm mt-1" style="color:${c.muted}">${t("last")}: ${state.lastUpdated.toLocaleString()}</p></div><button onclick="fetchData()" class="px-4 py-2 rounded-xl text-white font-semibold" style="background:${c.accent}">↻ ${state.loading?t("refreshing"):t("refresh")}</button></div><div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4 mt-6">${[[t("total"),total,"📦"],[t("ready"),count(READY),"✅"],[t("processing"),count(PROCESSING),"🕘"],[t("received"),count(RECEIVED),"📦"]].map(x=>`<div class="rounded-2xl p-5 border" style="background:${c.bg};border-color:${c.border}"><div class="flex justify-between"><div><div class="text-sm" style="color:${c.muted}">${x[0]}</div><div class="text-3xl font-extrabold mt-1">${x[1]}</div></div><div class="text-2xl">${x[2]}</div></div></div>`).join("")}</div></section><section class="units rounded-3xl p-6 border shadow-sm" style="background:${c.surface};border-color:${c.border}"><div class="flex justify-between items-center mb-5"><h2 class="text-xl font-bold">${t("units")}</h2><span class="text-sm" style="color:${c.muted}">${total} ${t("units").toLowerCase()}</span></div><div class="unit-grid unit-header px-5 py-3 mb-3 text-xs font-bold uppercase tracking-wide" style="color:${c.muted}"><div>${t("unit")}</div><div>${t("drip")}</div><div>${t("nonmed")}</div><div>${t("carts")}</div><div>${t("need")}</div></div><div class="space-y-4">${items.length?items.map(([unit,data])=>{let ready=data.drip?.status===READY||data.bukanUbat?.status===READY;return`<div class="unit-grid rounded-2xl p-4 border ${ready?"ready-card":""}" style="background:${c.bg};border-color:${ready?"#22c55e":c.border}"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl flex items-center justify-center text-xl" style="background:${c.accent}">🩺</div><div><div class="font-bold break-words">${esc(unit)}</div><div class="text-xs" style="color:${c.muted}">${t("unit")} ${t("inden")}</div></div></div><div><div class="text-xs font-bold mb-2" style="color:${c.accent}">💧 ${t("drip")}</div>${badge(data.drip?.status)||`<span class="text-sm" style="color:${c.muted}">${t("noStatus")}</span>`}</div><div><div class="text-xs font-bold mb-2" style="color:${c.purple}">💉 ${t("nonmed")}</div>${badge(data.bukanUbat?.status)||`<span class="text-sm" style="color:${c.muted}">${t("noStatus")}</span>`}</div><div><div class="text-xs font-bold" style="color:${c.green}">🛒 ${t("carts")}</div><div class="font-extrabold text-lg" style="color:${c.green}">${data.jumlahTroli||0}</div></div><div><div class="text-xs font-bold" style="color:#800000">${t("need")}</div><div class="font-extrabold text-lg">${normalizeTroli(data.perluTroli)==="✓"?`<span class="tick">✓</span>`:`<span class="cross">X</span>`}</div></div></div>`}).join(""):`<div class="text-center py-16" style="color:${c.muted}">${t("noData")}</div>`}</div></section></div><aside class="side lg:col-span-4 space-y-6">${settings}${renderNotifications(c)}${state.error?`<section class="error rounded-3xl p-5 border" style="background:${c.redSoft};border-color:${c.red}"><b>${t("error")}</b><div class="text-sm mt-1">${esc(state.error)}</div></section>`:""}</aside></div></main></div>`;
}

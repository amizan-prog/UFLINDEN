<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111827">
<title>UFL Inden Monitor</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{box-sizing:border-box}
:root{--font-scale:1;--drip-scale:1;--nonmed-scale:1;--carts-scale:1;--need-scale:1;--status-scale:1}
html{font-size:calc(16px * var(--font-scale));scroll-behavior:smooth}
body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;transition:.3s}
button,input,textarea,select{border-width:2px!important;transition:.2s}
button:hover{transform:translateY(-1px);filter:brightness(1.06)}
button:active{transform:translateY(0)}
.outer-frame{min-height:100vh;border:10px solid #172033}
.unit-grid{display:grid;grid-template-columns:1.2fr 1.15fr 1.25fr .85fr .85fr;gap:12px;align-items:stretch}
.unit-data{min-width:0;border:2px solid;border-radius:1rem;padding:12px;background:rgba(255,255,255,.35);display:flex;flex-direction:column;justify-content:center}
.status{display:flex;align-items:center;justify-content:center;width:100%;min-height:32px;text-align:center;font-weight:900;font-size:calc(.78rem * var(--status-scale));line-height:1rem;overflow-wrap:anywhere;border:2px solid;padding:5px 8px;border-radius:10px}
.current-status{animation:blinkStatus 1.15s ease-in-out infinite}
.cart-status{display:inline-flex;align-items:center;gap:5px;width:100%;justify-content:center;text-align:center;padding:4px 10px;border-radius:999px;font-weight:1000;font-size:calc(1.2rem * var(--status-scale))}
.cart-status.blink-cart{animation:blinkCart 1s ease-in-out infinite}
.cart-number{display:inline-block;font-size:calc(1.35rem * var(--carts-scale));font-weight:1000;text-align:center}
.column-label{font-size:.75rem;font-weight:700}
.column-label.drip-label{font-size:calc(.75rem * var(--drip-scale))}
.column-label.nonmed-label{font-size:calc(.75rem * var(--nonmed-scale))}
.column-label.carts-label{font-size:calc(.75rem * var(--carts-scale))}
.column-label.need-label{font-size:calc(.75rem * var(--need-scale))}
.unit-badge{width:3.2rem;height:3.2rem;display:inline-flex;align-items:center;justify-content:center;border-radius:1rem;font-size:1rem;font-weight:1000;letter-spacing:.02em;flex-shrink:0;border:2px solid;background:#dbeafe;color:#1e3a8a;border-color:#60a5fa;box-shadow:0 4px 0 #93c5fd}
.unit-badge.long{font-size:.68rem;line-height:.75rem;text-align:center;word-break:break-word;padding:4px}
.unit-badge.dark{background:#263752;color:#dbeafe;border-color:#4b6385;box-shadow:0 4px 0 #17233a}
.ready-card{position:relative;border:3px solid #4ade80!important;transform:translateY(-2px);box-shadow:0 0 0 3px #22c55e25,0 9px 0 #166534,0 15px 24px #22c55e30;animation:pulseGreen 2.5s ease-in-out infinite}
.ready-card:after{content:"✓ READY";position:absolute;top:-14px;right:18px;padding:3px 9px;border-radius:999px;color:#052e16;background:#bbf7d0;border:2px solid #4ade80;font-size:.62rem;font-weight:900}
.unit-title{position:relative;cursor:pointer;min-width:0}
.unit-title-name{border-bottom:2px dotted currentColor;overflow-wrap:anywhere}
.unit-full-name{display:none;position:absolute;z-index:20;left:0;top:calc(100% + 9px);min-width:220px;max-width:300px;padding:10px 12px;border-radius:12px;font-size:.78rem;line-height:1.25rem;font-weight:700;box-shadow:0 12px 28px #0004}
.unit-title:hover .unit-full-name,.unit-title.active .unit-full-name{display:block}
.stat-icon{width:3.2rem;height:3.2rem;display:flex;align-items:center;justify-content:center;border-radius:1rem;font-size:1.65rem;border:2px solid}
.stat-total{background:#e5e7eb;border-color:#9ca3af;box-shadow:inset 0 -4px 0 #9ca3af}
.stat-ready{background:#bbf7d0;border-color:#4ade80;box-shadow:inset 0 -4px 0 #16a34a}
.stat-processing{background:#fef08a;border-color:#f59e0b;box-shadow:inset 0 -4px 0 #ea580c}
.stat-received{background:#bfdbfe;border-color:#60a5fa;box-shadow:inset 0 -4px 0 #2563eb}
.toast-wrap{position:fixed;top:82px;right:24px;z-index:100;display:flex;flex-direction:column;gap:12px;width:min(390px,calc(100vw - 32px));pointer-events:none}
.toast{pointer-events:auto;position:relative;overflow:hidden;border:2px solid #facc15;border-left-width:6px;box-shadow:0 12px 30px #0003;animation:toastIn .35s ease both}
.flow{color:#94a3b8;font-weight:900}
.sound-active{animation:soundPulse 1s ease-in-out infinite}
.size-control{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;align-items:center;gap:8px}
.size-control button{min-width:36px;padding:5px 9px;border-radius:10px;font-weight:900}
.size-value{min-width:42px;text-align:center;font-weight:800;color:#64748b}
@keyframes blinkStatus{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.28;transform:scale(.96);box-shadow:0 0 0 5px #38bdf855}}
@keyframes blinkCart{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.86);filter:brightness(1.7)}}
@keyframes pulseGreen{0%,100%{box-shadow:0 0 0 3px #22c55e25,0 9px 0 #166534,0 15px 24px #22c55e30}50%{box-shadow:0 0 0 5px #22c55e45,0 11px 0 #14532d,0 20px 30px #22c55e4d}}
@keyframes toastIn{from{transform:translateX(35px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes soundPulse{50%{box-shadow:0 0 0 5px #22d3ee55}}
@media(max-width:1279px){.unit-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.unit-header{display:none}.unit-grid:not(.unit-header)>:first-child{grid-column:1/-1}}
@media(max-width:640px){.outer-frame{border-width:5px}.header-inner{padding-left:10px!important;padding-right:10px!important;gap:8px!important}.brand-title{font-size:.82rem}.header-actions{gap:5px!important;max-width:calc(100vw - 150px)}.header-actions button{padding:.4rem .55rem!important;font-size:.72rem}.units,.stats-card,.dashboard-card{padding:1rem!important}.dashboard-title{font-size:1rem!important}.unit-grid{gap:10px;padding:10px!important}.unit-data{padding:10px}.ready-card:after{right:12px;font-size:.55rem}.toast-wrap{top:70px;right:16px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body class="bg-slate-100 text-slate-900">
<div id="app"></div>
<div id="toastContainer" class="toast-wrap"></div>

<script>
const DEFAULT_SHEET_URL="https://docs.google.com/spreadsheets/d/1m6D6POkxoEGPr0n8X4N2xv3nC5j0rxvsML02tGkK1to/edit?gid=0#gid=0";
const READY="Sedia Diambil",PROCESSING="Sedang Diproses",RECEIVED="Baru Diterima",HIDDEN="Inden Belum Diterima";
const N={ICU:"Unit Rawatan Rapi",W5A:"Wad 5A (LELAKI)",W6A:"Wad 6A (PEREMPUAN)",W6B:"Wad 6B",W7A:"Wad 7A (PEREMPUAN)",W7B:"Wad 7B (LELAKI)",ADM:"Unit Hasil",BOT:"Unit Brakiterapi",CSSD:"Unit Bekalan Steril",DCO:"Unit Rawatan Harian Onkologi",HNU:"Unit Rawatan Kanser Di Rumah",IFS:"Unit Kawalan Infeksi",GOT:"Dewan Bedah Am",PAT:"Unit Patologi",PHY:"Unit Fisiologi",TCM:"Unit Rawatan Tradisional dan Komplementari",IPC:"Unit Farmasi Pesakit Dalam",UKA:"Unit Kesihatan Awam",RKD:"Unit Rekod Perubatan",PPD:"Pusat Pengambilan Darah",W8A:"Wad 8A (LELAKI)",W8B:"Wad 8B (PEREMPUAN)",W9A:"Wad Multidisiplin 9A",W9B:"Wad Eksekutif 9B",DIET:"Unit Dietetik & Sajian",ED:"Unit Kecemasan",MOR:"Unit Mortuari/Forensik",MDC:"Klinik Multidisiplin",NM189:"Unit Perubatan Nuklear (Farmasi)",NMC:"Klinik Perubatan Nuklear",ONC:"Klinik Onkologi","PETCT(F)":"Farmasi PETCT",RADIO:"Radiologi",RTC:"Klinik Radioterapi",RTT:"Unit Rawatan Radioterapi",WRR:"Wad Radionuklik",OPC:"Unit Farmasi Luar","PETCT(N)":"PETCT (Nursing)"};
const TEXT={ms:{tracker:"Pengesan status semasa",settings:"Aturan",dashboard:"Papan Pemuka Status Inden",unitInden:"Unit Inden",last:"Terakhir dikemaskini",refresh:"Muat Semula",refreshing:"Mengemaskini...",total:"Jumlah Unit",ready:"Sedia",processing:"Proses",received:"Baru Diterima",unit:"Unit",drip:"Drip",nonmed:"Bukan Ubat",carts:"Jumlah Troli",need:"Perlu Troli",sheet:"URL Google Sheet",save:"Simpan & Muatkan",error:"Ralat",noData:"Tiada data dimuatkan lagi.",noStatus:"Tiada status",sound:"Bunyi notifikasi",chime:"Chime",doorbell:"Doorbell",whistle:"Whistle",ring:"Ring",loop:"Bunyi berulang sehingga notifikasi ditutup",on:"Hidup",off:"Tutup",test:"Uji Bunyi",search:"Cari unit...",font:"Saiz teks",fontReset:"Tetapkan saiz",resize:"Saiz label dan status",statusFont:"Saiz teks status",increase:"Besarkan",decrease:"Kecilkan"},
en:{tracker:"Current status tracker",settings:"Settings",dashboard:"Indent Status Dashboard",unitInden:"Indent Units",last:"Last updated",refresh:"Refresh",refreshing:"Refreshing...",total:"Total Units",ready:"Ready",processing:"Processing",received:"Newly Received",unit:"Unit",drip:"Drip",nonmed:"Non-Medicine",carts:"Total Carts",need:"Carts Needed",sheet:"Google Sheet URL",save:"Save & Load",error:"Error",noData:"No data loaded yet.",noStatus:"No status",sound:"Notification sound",chime:"Chime",doorbell:"Doorbell",whistle:"Whistle",ring:"Ring",loop:"Sound repeats until the notification is closed",on:"On",off:"Off",test:"Test Sound",search:"Search unit...",font:"Text size",fontReset:"Reset size",resize:"Label and status size",statusFont:"Status text size",increase:"Increase",decrease:"Decrease"}};
const LIGHT={bg:"#f8fafc",surface:"#fff",ink:"#0f172a",muted:"#64748b",border:"#e2e8f0",accent:"#2563eb",purple:"#7c3aed",green:"#16a34a",red:"#dc2626",redSoft:"#fee2e2",amber:"#d97706",input:"#fff",header:"#111827"};
const DARK={bg:"#111827",surface:"#1f2937",ink:"#f8fafc",muted:"#cbd5e1",border:"#475569",accent:"#60a5fa",purple:"#c4b5fd",green:"#4ade80",red:"#fb7185",redSoft:"#451a24",amber:"#fbbf24",input:"#172236",header:"#020617"};
const savedSizes=JSON.parse(localStorage.getItem("ufl-column-sizes")||"{}");
const state={units:{},previous:{},toasts:[],activeUnit:null,search:"",sheetUrl:localStorage.getItem("ufl-sheet-url")||DEFAULT_SHEET_URL,theme:localStorage.getItem("ufl-theme")||"light",lang:localStorage.getItem("ufl-lang")||"ms",sound:localStorage.getItem("ufl-sound")!=="off",soundType:localStorage.getItem("ufl-sound-type")||"chime",loop:localStorage.getItem("ufl-sound-loop")!=="off",fontScale:+localStorage.getItem("ufl-font-scale")||1,sizes:{drip:+savedSizes.drip||1,nonmed:+savedSizes.nonmed||1,carts:+savedSizes.carts||1,need:+savedSizes.need||1,status:+savedSizes.status||1},loading:false,error:"",lastUpdated:new Date(),settings:false};
const LEGACY={"Inden Sedia Diambil":READY,"Inden Sedang Diproses":PROCESSING,"Inden Baru Diterima":RECEIVED};
const valid=[READY,PROCESSING,RECEIVED,HIDDEN];
let audioContext=null,soundLoop=null;
const t=k=>TEXT[state.lang][k]||k,colors=()=>state.theme==="dark"?DARK:LIGHT;
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const normalize=v=>LEGACY[String(v||"").trim()]||String(v||"").trim();
const unitName=u=>N[String(u).trim().toUpperCase()]||String(u).trim();
const label=s=>state.lang==="en"?(s===READY?"Ready":s===PROCESSING?"Processing":s===RECEIVED?"Newly Received":"Not Yet Received"):(s===READY?"Sedia Diambil":s===PROCESSING?"Diproses":s===RECEIVED?"Baru Diterima":"Belum Diterima");
const statusColor=s=>{let c=colors();return s===READY?c.green:s===PROCESSING?c.amber:s===RECEIVED?c.accent:c.muted};
const normalizeTroli=v=>["ya","yes","true","1","✓","✔","tick","ticked"].includes(String(v??"").trim().toLowerCase())?"✓":"X";

function applyFont(){document.documentElement.style.setProperty("--font-scale",state.fontScale)}
function applySizes(){Object.entries(state.sizes).forEach(([k,v])=>document.documentElement.style.setProperty("--"+k+"-scale",v))}
function changeFont(){state.fontScale=state.fontScale>=1.35?1:Math.min(1.35,Math.round((state.fontScale+.15)*100)/100);localStorage.setItem("ufl-font-scale",state.fontScale);applyFont();render()}
function resetFont(){state.fontScale=1;localStorage.setItem("ufl-font-scale","1");applyFont();render()}
function adjustSize(key,amount){state.sizes[key]=Math.min(1.6,Math.max(.7,Math.round((state.sizes[key]+amount)*100)/100));localStorage.setItem("ufl-column-sizes",JSON.stringify(state.sizes));applySizes();render()}
function resetSizes(){Object.keys(state.sizes).forEach(k=>state.sizes[k]=1);localStorage.setItem("ufl-column-sizes",JSON.stringify(state.sizes));applySizes();render()}
function tone(f,s,d,type="sine",e=f){if(!audioContext)return;let o=audioContext.createOscillator(),g=audioContext.createGain(),n=audioContext.currentTime+s;o.type=type;o.frequency.setValueAtTime(f,n);o.frequency.linearRampToValueAtTime(e,n+d);g.gain.setValueAtTime(.001,n);g.gain.exponentialRampToValueAtTime(.14,n+.025);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(audioContext.destination);o.start(n);o.stop(n+d+.03)}
function playSound(){if(!state.sound)return;try{audioContext=audioContext||new(window.AudioContext||window.webkitAudioContext)();if(audioContext.state==="suspended")audioContext.resume();if(state.soundType==="doorbell"){tone(523,0,.35,"sine",659);tone(659,.4,.55,"sine",784)}else if(state.soundType==="whistle"){tone(900,0,.22,"triangle",1500);tone(1500,.25,.3,"triangle",1000)}else if(state.soundType==="ring"){tone(740,0,.22,"square");tone(740,.28,.22,"square");tone(740,.56,.3,"square")}else{tone(660,0,.28,"sine",990);tone(990,.3,.42,"sine",1320)}}catch(e){}}
function startSoundLoop(){if(!state.sound)return;playSound();clearInterval(soundLoop);if(state.loop)soundLoop=setInterval(()=>state.toasts.length&&state.sound?playSound():stopSoundLoop(),1300)}
function stopSoundLoop(){clearInterval(soundLoop);soundLoop=null}
function setSoundType(v){state.soundType=v;localStorage.setItem("ufl-sound-type",v);render()}
function toggleLoop(){state.loop=!state.loop;localStorage.setItem("ufl-sound-loop",state.loop?"on":"off");if(!state.loop)stopSoundLoop();render()}
function toggleSound(){state.sound=!state.sound;localStorage.setItem("ufl-sound",state.sound?"on":"off");state.sound?startSoundLoop():stopSoundLoop();render()}
function toggleTheme(){state.theme=state.theme==="light"?"dark":"light";localStorage.setItem("ufl-theme",state.theme);render()}
function setLanguage(){state.lang=state.lang==="ms"?"en":"ms";localStorage.setItem("ufl-lang",state.lang);render()}
function toggleSettings(){state.settings=!state.settings;render()}
function toggleUnitInfo(id){state.activeUnit=state.activeUnit===id?null:id;render()}
function setSearch(v){state.search=v;render()}
function badge(s,blink=false){let c=colors();return s?`<span class="status ${blink&&s!==HIDDEN?"current-status":""}" style="color:${s===READY?"#052e16":"#fff"};background:${s===READY?"#bbf7d0":statusColor(s)};border-color:${s===READY?"#86efac":statusColor(s)}">${s===READY?"✅ ":""}${esc(label(s))}</span>`:`<span style="color:${c.muted}">${t("noStatus")}</span>`}
function unitBadge(u){let x=String(u).trim().toUpperCase(),z=["CSSD","DIET","ED","NM189","PETCT(F)","PETCT(N)"].includes(x)?x:x.slice(0,3);return`<div class="unit-badge ${z.length>3?"long":""} ${state.theme==="dark"?"dark":""}">${esc(z)}</div>`}
function csvUrl(url){let m=String(url).match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);if(!m)return"";try{let p=new URL(url);return`https://docs.google.com/spreadsheets/d/${m[1]}/export?format=csv&gid=${p.searchParams.get("gid")||0}`}catch{return""}}
function parseCSV(text){let rows=[],row=[],cell="",quote=false;for(let i=0;i<text.length;i++){let x=text[i];if(quote){if(x==='"'&&text[i+1]==='"'){cell+='"';i++}else if(x==='"')quote=false;else cell+=x}else if(x==='"')quote=true;else if(x===","){row.push(cell.trim());cell=""}else if(x==="\n"){row.push(cell.trim());rows.push(row);row=[];cell=""}else if(x!=="\r")cell+=x}if(cell||row.length){row.push(cell.trim());rows.push(row)}return rows}
function toast(unit,cat,old,now){state.toasts.unshift({id:Date.now()+Math.random(),unit,cat,old,now,time:new Date().toLocaleTimeString()});state.toasts=state.toasts.slice(0,5);startSoundLoop();renderToasts()}
function renderToasts(){let c=colors();document.getElementById("toastContainer").innerHTML=state.toasts.map(n=>`<div class="toast rounded-2xl p-4 ${state.sound?"sound-active":""}" style="background:${c.surface};color:${c.ink}"><div class="flex justify-between"><b>🔔 ${esc(unitName(n.unit))}</b><button onclick="dismissToast('${n.id}')">×</button></div><div class="text-xs mt-2" style="color:${c.muted}">${n.cat==="drip"?"💧 "+t("drip"):"💉 "+t("nonmed")}</div><div class="flex flex-wrap items-center justify-center gap-1 mt-3">${badge(n.old)}<span class="flow">→</span>${badge(n.now)}</div></div>`).join("")}
function dismissToast(id){state.toasts=state.toasts.filter(x=>String(x.id)!==String(id));if(!state.toasts.length)stopSoundLoop();renderToasts()}
function saveSettings(){state.sheetUrl=document.getElementById("sheetUrl").value.trim();localStorage.setItem("ufl-sheet-url",state.sheetUrl);state.settings=false;fetchData()}
async function fetchData(){if(state.loading)return;state.loading=true;state.error="";render();try{let r=await fetch(csvUrl(state.sheetUrl));if(!r.ok)throw Error(t("error"));let result={};parseCSV(await r.text()).forEach(a=>{let u=(a[0]||"").trim(),d=normalize(a[1]),n=normalize(a[2]);if(u&&u.toLowerCase()!=="unit"&&(valid.includes(d)||valid.includes(n)))result[u]={drip:{status:d||HIDDEN},bukanUbat:{status:n||HIDDEN},jumlahTroli:+a[3]||0,perluTroli:normalizeTroli(a[4])}});let current={};Object.entries(result).forEach(([u,d])=>["drip","bukanUbat"].forEach(cat=>{let now=d[cat].status,key=u+"-"+cat,old=state.previous[key];if(old!==undefined&&old!==now&&now!==HIDDEN)toast(u,cat,old,now);current[key]=now}));state.previous=current;state.units=Object.fromEntries(Object.entries(result).filter(([,u])=>!(u.drip.status===HIDDEN&&u.bukanUbat.status===HIDDEN)));state.lastUpdated=new Date()}catch(e){state.error=e.message||t("error")}state.loading=false;render()}

function sizeRow(key,labelText){return`<div class="size-control"><span>${labelText}</span><button onclick="adjustSize('${key}',-.1)" class="bg-slate-200 text-slate-800" title="${t("decrease")}">A−</button><span class="size-value">${Math.round(state.sizes[key]*100)}%</span><button onclick="adjustSize('${key}',.1)" class="bg-amber-300 text-amber-950" title="${t("increase")}">A+</button></div>`}
function render(){
let c=colors();let all=Object.entries(state.units).sort(([a,x],[b,y])=>{let A=x.drip.status===READY||x.bukanUbat.status===READY,B=y.drip.status===READY||y.bukanUbat.status===READY;return A!==B?B-A:a.localeCompare(b,undefined,{numeric:true})});let q=state.search.trim().toLowerCase(),items=all.filter(([u])=>!q||u.toLowerCase().includes(q)||unitName(u).toLowerCase().includes(q));let total=all.length,count=s=>all.filter(([,u])=>u.drip.status===s||u.bukanUbat.status===s).length;document.body.style.background=c.bg;document.body.style.color=c.ink;applyFont();applySizes();

let settings=state.settings?`<section class="rounded-3xl p-6 border" style="background:${c.surface};border-color:${c.border}"><div class="flex justify-between mb-4"><h3 class="font-bold text-lg">⚙️ ${t("settings")}</h3><button onclick="toggleSettings()">✕</button></div><label class="text-sm font-semibold">${t("sheet")}</label><textarea id="sheetUrl" rows="3" class="w-full mt-2 rounded-2xl px-4 py-3" style="background:${c.input};color:${c.ink};border-color:${c.border}">${esc(state.sheetUrl)}</textarea>
<div class="mt-6 rounded-2xl border p-4" style="border-color:${c.border}"><div class="flex items-center justify-between gap-3 flex-wrap"><div><div class="font-bold">🔊 ${t("sound")}</div><div class="text-xs mt-1" style="color:${c.muted}">${state.sound?t("on"):t("off")}</div></div><button onclick="toggleSound()" class="px-4 py-2 rounded-xl font-bold ${state.sound?"bg-cyan-300 text-cyan-950":"bg-slate-600 text-white"}">${state.sound?t("on"):t("off")}</button></div><div class="grid sm:grid-cols-2 gap-3 mt-4"><label class="text-sm font-semibold">${t("sound")}<select onchange="setSoundType(this.value)" class="block w-full mt-1 rounded-xl px-3 py-2" style="background:${c.input};color:${c.ink};border-color:${c.border}"><option value="chime" ${state.soundType==="chime"?"selected":""}>${t("chime")}</option><option value="doorbell" ${state.soundType==="doorbell"?"selected":""}>${t("doorbell")}</option><option value="whistle" ${state.soundType==="whistle"?"selected":""}>${t("whistle")}</option><option value="ring" ${state.soundType==="ring"?"selected":""}>${t("ring")}</option></select></label><div class="flex items-end"><button onclick="playSound()" class="w-full rounded-xl px-3 py-2 bg-violet-500 text-white font-bold">▶ ${t("test")}</button></div></div><label class="flex gap-2 items-center mt-4 text-sm"><input type="checkbox" ${state.loop?"checked":""} onchange="toggleLoop()"> <span>${t("loop")}</span></label></div>
<div class="mt-6 rounded-2xl border p-4" style="border-color:${c.border}"><div class="flex justify-between items-center gap-3 mb-3"><b>🔠 ${t("resize")}</b><button onclick="resetSizes()" class="px-3 py-1 rounded-lg bg-slate-200 text-slate-800 text-sm font-bold">${t("fontReset")}</button></div><div class="space-y-3">${sizeRow("drip",t("drip"))}${sizeRow("nonmed",t("nonmed"))}${sizeRow("carts",t("carts"))}${sizeRow("need",t("need"))}<div class="border-t pt-3 mt-3" style="border-color:${c.border}">${sizeRow("status",t("statusFont"))}</div></div></div>
<button onclick="saveSettings()" class="w-full mt-4 px-4 py-3 rounded-2xl text-white font-bold bg-blue-500">${t("save")}</button></section>`:"";

let stats=[[t("total"),total,"📦","stat-total"],[t("ready"),count(READY),"✅","stat-ready"],[t("processing"),count(PROCESSING),"🕘","stat-processing"],[t("received"),count(RECEIVED),"📥","stat-received"]];

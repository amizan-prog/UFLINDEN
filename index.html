<style>
*{box-sizing:border-box}
:root{--font-scale:1;--title-status-scale:1}
html{font-size:calc(16px * var(--font-scale));scroll-behavior:smooth}
body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;transition:.3s}
button,input,textarea,select{border-width:2px!important;transition:.2s}
button:hover{transform:translateY(-1px);filter:brightness(1.06)}
button:active{transform:translateY(0)}
.outer-frame{min-height:100vh;border:10px solid #172033}
.unit-grid{display:grid;grid-template-columns:1.2fr 1.15fr 1.25fr .85fr .85fr;gap:12px;align-items:stretch}
.unit-data{min-width:0;border:2px solid;border-radius:1rem;padding:12px;background:#ffffff59;display:flex;flex-direction:column;justify-content:center}
.status{display:flex;align-items:center;justify-content:center;width:100%;min-height:32px;text-align:center;font-weight:900;font-size:calc(.78rem * var(--title-status-scale));line-height:1rem;overflow-wrap:anywhere;border:2px solid;padding:5px 8px;border-radius:10px}
.current-status{animation:blinkStatus 1.15s ease-in-out infinite}
.cart-status{display:inline-flex;align-items:center;gap:5px;width:100%;justify-content:center;text-align:center;padding:4px 10px;border-radius:999px;font-weight:1000;font-size:1.2rem}
.cart-status.blink-cart{animation:blinkCart 1s ease-in-out infinite}
.cart-number{display:inline-block;font-size:1.35rem;font-weight:1000;text-align:center}
.column-label{font-size:.75rem;font-weight:700}
.unit-badge{width:3.2rem;height:3.2rem;display:inline-flex;align-items:center;justify-content:center;border-radius:1rem;font-size:1rem;font-weight:1000;letter-spacing:.02em;flex-shrink:0;border:2px solid;background:#dbeafe;color:#1e3a8a;border-color:#60a5fa;box-shadow:0 4px 0 #93c5fd}
.unit-badge.long{font-size:.68rem;line-height:.75rem;text-align:center;word-break:break-word;padding:4px}
.unit-badge.dark{background:#263752;color:#dbeafe;border-color:#4b6385;box-shadow:0 4px 0 #17233a}
.ready-card{position:relative;border:3px solid #4ade80!important;transform:translateY(-2px);box-shadow:0 0 0 3px #22c55e25,0 9px 0 #166534,0 15px 24px #22c55e30;animation:pulseGreen 2.5s ease-in-out infinite}
.ready-card:after{content:"✓ READY";position:absolute;top:-14px;right:18px;padding:3px 9px;border-radius:999px;color:#052e16;background:#bbf7d0;border:2px solid #4ade80;font-size:.62rem;font-weight:900}
.unit-title{position:relative;cursor:pointer;min-width:0;flex:1}
.unit-title-name{border-bottom:2px dotted currentColor;overflow-wrap:anywhere;font-size:calc(1rem * var(--title-status-scale))}
.unit-full-name{display:none;position:absolute;z-index:20;left:0;top:calc(100% + 9px);min-width:220px;max-width:300px;padding:10px 12px;border-radius:12px;font-size:calc(.78rem * var(--title-status-scale));line-height:1.25rem;font-weight:700;box-shadow:0 12px 28px #0004}
.unit-title:hover .unit-full-name,.unit-title.active .unit-full-name{display:block}
.speak-button{width:38px;height:38px;flex-shrink:0;border-radius:12px;background:#dbeafe;color:#1d4ed8;border:2px solid #60a5fa;font-size:1.1rem}
.speak-button.speaking{background:#a7f3d0;color:#065f46;border-color:#10b981;animation:soundPulse 1s ease-in-out infinite}
.stat-icon{width:3.2rem;height:3.2rem;display:flex;align-items:center;justify-content:center;border-radius:1rem;font-size:1.65rem;border:2px solid}
.stat-total{background:#e5e7eb;border-color:#9ca3af;box-shadow:inset 0 -4px 0 #9ca3af}
.stat-ready{background:#bbf7d0;border-color:#4ade80;box-shadow:inset 0 -4px 0 #16a34a}
.stat-processing{background:#fef08a;border-color:#f59e0b;box-shadow:inset 0 -4px 0 #ea580c}
.stat-received{background:#bfdbfe;border-color:#60a5fa;box-shadow:inset 0 -4px 0 #2563eb}
.toast-wrap{position:fixed;top:82px;right:24px;z-index:100;display:flex;flex-direction:column;gap:12px;width:min(390px,calc(100vw - 32px));pointer-events:none}
.toast{pointer-events:auto;position:relative;overflow:hidden;border:2px solid #facc15;border-left-width:6px;box-shadow:0 12px 30px #0003;animation:toastIn .35s ease both}
.sound-active{animation:soundPulse 1s ease-in-out infinite}
@keyframes blinkStatus{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.28;transform:scale(.96);box-shadow:0 0 0 5px #38bdf855}}
@keyframes blinkCart{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.86);filter:brightness(1.7)}}
@keyframes pulseGreen{0%,100%{box-shadow:0 0 0 3px #22c55e25,0 9px 0 #166534,0 15px 24px #22c55e30}50%{box-shadow:0 0 0 5px #22c55e45,0 11px 0 #14532d,0 20px 30px #22c55e4d}}
@keyframes toastIn{from{transform:translateX(35px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes soundPulse{50%{box-shadow:0 0 0 5px #22d3ee55}}
@media(max-width:1279px){.unit-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.unit-header{display:none}.unit-grid:not(.unit-header)>:first-child{grid-column:1/-1}}
@media(max-width:640px){.outer-frame{border-width:5px}.unit-grid{gap:10px;padding:10px!important}.unit-data{padding:10px}.ready-card:after{right:12px;font-size:.55rem}.toast-wrap{top:70px;right:16px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>

en:{title:"UFL Indent Monitor",tracker:"Current status tracker",settings:"Settings",dashboard:"Indent Status Dashboard",unitInden:"Indent Units",last:"Last updated",refresh:"Refresh",refreshing:"Refreshing...",total:"Total Units",ready:"Ready",processing:"Processing",received:"Newly Received",unit:"Unit",drip:"Drip",nonmed:"Non-Medicine",carts:"Total Carts",need:"Carts Needed",sheet:"Google Sheet URL",save:"Save & Load",error:"Error",noData:"No data loaded yet.",noStatus:"No status",sound:"Notification sound",on:"On",off:"Off",test:"Test Sound",voice:"Google UK English voice",gender:"Voice gender",male:"Male",female:"Female",auto:"Automatic",testText:"Voice test text",testPlaceholder:"Type text to test...",testVoice:"Test Voice Text",speakEmpty:"There is no text to read.",languageVoice:"Speech language",search:"Search unit...",fontSize:"Text Size",reset:"Reset",titleStatusFontSize:"Title & Status Text Size",statusPrefix:"current status for",nativeNotif:"OS Notifications",nativeNotifDesc:"Show system notifications when status changes.",enableNotif:"Enable Notifications?",enableNotifBody:"Allow this site to send you system notifications when indent status changes.",notifNotNow:"Not Now",notifEnable:"Enable"}

const LEGACY={"Inden Sedia Diambil":READY,"Inden Sedang Diproses":PROCESSING,"Inden Baru Diterima":RECEIVED};
const state={units:{},previous:{},toasts:[],activeUnit:null,search:"",sheetUrl:localStorage.getItem("ufl-sheet-url")||DEFAULT_SHEET_URL,theme:localStorage.getItem("ufl-theme")||"light",lang:localStorage.getItem("ufl-lang")||"ms",sound:localStorage.getItem("ufl-sound")!=="off",soundType:localStorage.getItem("ufl-sound-type")||"chime",testText:localStorage.getItem("ufl-tts-test-ms")||"Ini ialah ujian suara Google Bahasa Indonesia.",loading:false,error:"",lastUpdated:new Date(),settings:false,fontScale:+(localStorage.getItem("ufl-font-scale")||1),titleStatusScale:+(localStorage.getItem("ufl-title-status-scale")||1),notifications:localStorage.getItem("ufl-notifications")==="true",notifPrompt:!localStorage.getItem("ufl-notif-prompt")&&"Notification" in window&&Notification.permission==="default"};

const colors=()=>state.theme==="dark"?{bg:"#111827",surface:"#1f2937",ink:"#f8fafc",muted:"#cbd5e1",border:"#475569",accent:"#60a5fa",purple:"#c4b5fd",green:"#4ade80",red:"#fb7185",redSoft:"#451a24",amber:"#fbbf24",input:"#172236",header:"#020617"}:{bg:"#f8fafc",surface:"#fff",ink:"#0f172a",muted:"#64748b",border:"#e2e8f0",accent:"#2563eb",purple:"#7c3aed",green:"#16a34a",red:"#dc2626",redSoft:"#fee2e2",amber:"#d97706",input:"#fff",header:"#111827"};

const statusColor=s=>{let c=colors();return s===READY?c.green:s===PROCESSING?c.amber:s===RECEIVED?c.accent:c.muted};
const voiceTarget=()=>state.lang==="ms"?{lang:"id-ID",pattern:/id[-_]?ID|indones/i,default:"Google Bahasa Indonesia"}:{lang:"en-GB",pattern:/en[-_]?GB|english.*uk|uk.*english/i,default:"Google UK English"};

function speakUnit(u){let d=state.units[u];if(!d)return;let name=(state.lang==='en'?(NE[String(u).trim().toUpperCase()]||unitName(u)):unitName(u));speakText(`${t("statusPrefix")} ${name}. ${t("drip")}: ${label(d.drip)}. ${t("nonmed")}: ${label(d.nonmed)}. ${t("carts")}: ${d.carts}. ${t("need")}: ${d.need?(state.lang==='en'?'Yes':'Ya'):(state.lang==='en'?'No':'Tidak')}`)}
function speakTest(){let e=document.getElementById("testText");state.testText=e?.value||state.testText;localStorage.setItem("ufl-tts-test-ms",state.testText);speakText(state.testText)}
function tone(f,s,d,end=f){if(!audioContext)return;let o=audioContext.createOscillator(),g=audioContext.createGain(),n=audioContext.currentTime+s;o.frequency.setValueAtTime(f,n);o.frequency.linearRampToValueAtTime(end,n+d);g.gain.setValueAtTime(.001,n);g.gain.exponentialRampToValueAtTime(.14,n+.02);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(audioContext.destination);o.start(n);o.stop(n+d+.03)}
function playSound(){if(!state.sound)return;try{audioContext=audioContext||new(window.AudioContext||window.webkitAudioContext)();tone(660,0,.25,990);tone(990,.28,.4,1320)}catch(e){}}
function startSoundLoop(){if(soundLoopInterval||!state.sound)return;soundLoopInterval=setInterval(()=>playSound(),1500);playSound()}

function toggleSound(){state.sound=!state.sound;localStorage.setItem("ufl-sound",state.sound?"on":"off");if(!state.sound)stopSoundLoop();render()}

function csvUrl(url){let m=String(url).match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);if(!m)return"";try{let p=new URL(url);return`https://docs.google.com/spreadsheets/d/${m[1]}/export?format=csv&gid=${p.searchParams.get("gid")||0}`}catch{return""}}
function parseCSV(s){let rows=[],row=[],cell="",q=false;for(let i=0;i<s.length;i++){let ch=s[i];if(q){if(ch==='"'&&s[i+1]==='"'){cell+='"';i++}else if(ch==='"')q=false;else cell+=ch}else if(ch==='"')q=true;else if(ch===","){row.push(cell.trim());cell=""}else if(ch==="\n"){row.push(cell.trim());rows.push(row);row=[];cell=""}else if(ch!=="\r")cell+=ch}if(cell||row.length){row.push(cell.trim());rows.push(row)}return rows}
async function fetchData(){
 if(state.loading)return;state.loading=true;state.error="";render();
 try{let r=await fetch(csvUrl(state.sheetUrl));if(!r.ok)throw Error(t("error"));let result={},current={},valid=[READY,PROCESSING,RECEIVED,HIDDEN];

 state.units=Object.fromEntries(Object.entries(result).filter(([,d])=>d.drip!==HIDDEN||d.nonmed!==HIDDEN));

 }catch(e){state.error=e.message||t("error")}state.loading=false;render()
}
function toggleSettings(){state.settings=!state.settings;render()}
function toggleTheme(){state.theme=state.theme==="light"?"dark":"light";localStorage.setItem("ufl-theme",state.theme);render()}
function setLanguage(){state.lang=state.lang==="ms"?"en":"ms";localStorage.setItem("ufl-lang",state.lang);render()}
function setSearch(v){state.search=v;render()}
function saveSettings(){state.sheetUrl=document.getElementById("sheetUrl").value.trim();localStorage.setItem("ufl-sheet-url",state.sheetUrl);state.settings=false;fetchData()}
function unitBadge(u){let x=String(u).toUpperCase(),z=["CSSD","DIET","ED","NM189","PETCT(F)","PETCT(N)"].includes(x)?x:x.slice(0,3);return`<div class="unit-badge ${z.length>3?"long":""} ${state.theme==="dark"?"dark":""}">${esc(z)}</div>`}
function updateFontScale(){document.documentElement.style.setProperty('--font-scale',state.fontScale)}
function adjustFontScale(delta){let next=Math.round((state.fontScale+delta)*100)/100;state.fontScale=Math.max(0.75,Math.min(1.5,next));localStorage.setItem('ufl-font-scale',state.fontScale);updateFontScale();render()}
function resetFontScale(){state.fontScale=1;localStorage.setItem('ufl-font-scale',state.fontScale);updateFontScale();render()}
function updateTitleStatusScale(){document.documentElement.style.setProperty('--title-status-scale',state.titleStatusScale)}
function adjustTitleStatusScale(delta){let next=Math.round((state.titleStatusScale+delta)*100)/100;state.titleStatusScale=Math.max(0.75,Math.min(1.5,next));localStorage.setItem('ufl-title-status-scale',state.titleStatusScale);updateTitleStatusScale();render()}
function resetTitleStatusScale(){state.titleStatusScale=1;localStorage.setItem('ufl-title-status-scale',state.titleStatusScale);updateTitleStatusScale();render()}
function showNativeNotification(title,options={}){
  if(!state.notifications||Notification.permission!=="granted")return;
  const icon="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20192%20192%22%3E%3Crect%20fill%3D%22%23111827%22%20width%3D%22192%22%20height%3D%22192%22%2F%3E%3Ctext%20x%3D%2296%22%20y%3D%22120%22%20font-size%3D%2280%22%20text-anchor%3D%22middle%22%20fill%3D%22white%22%3EUFL%3C%2Ftext%3E%3C%2Fsvg%3E";
  const opts={icon,badge:icon,tag:"ufl-inden",...options};
  if("serviceWorker" in navigator && navigator.serviceWorker.controller){
    navigator.serviceWorker.ready.then(reg=>reg.showNotification(title,opts)).catch(()=>new Notification(title,opts));
  }else{
    new Notification(title,opts);
  }
}
async function toggleNotifications(){
  if(!("Notification" in window)){alert(state.lang==="ms"?"Pelayar tidak menyokong notifikasi sistem.":"Browser does not support system notifications.");return;}
  if(state.notifications){
    state.notifications=false;localStorage.setItem("ufl-notifications","false");render();return;
  }
  const perm=await Notification.requestPermission();
  if(perm==="granted"){
    state.notifications=true;localStorage.setItem("ufl-notifications","true");
    showNativeNotification("UFL Monitor",{body:state.lang==="ms"?"Notifikasi sistem diaktifkan.":"System notifications enabled.",tag:"ufl-init"});
  }else{
    state.notifications=false;localStorage.setItem("ufl-notifications","false");
    alert(state.lang==="ms"?"Kebenaran notifikasi ditolak.":"Notification permission denied.");
  }
  render();
}
function dismissNotifPrompt(){
  localStorage.setItem("ufl-notif-prompt","dismissed");
  state.notifPrompt=false;
  render();
}
async function enableNotifPrompt(){
  if(!("Notification" in window)){dismissNotifPrompt();return;}
  const perm=await Notification.requestPermission();
  if(perm==="granted"){
    state.notifications=true;
    localStorage.setItem("ufl-notifications","true");
    showNativeNotification("UFL Monitor",{body:state.lang==="ms"?"Notifikasi sistem diaktifkan.":"System notifications enabled.",tag:"ufl-init"});
  }
  localStorage.setItem("ufl-notif-prompt","dismissed");
  state.notifPrompt=false;
  render();
}
function testNativeNotification() {
  if (!("Notification" in window)) {
    alert(state.lang==="ms"?"Pelayar tidak menyokong notifikasi sistem.":"Browser does not support system notifications.");
    return;
  }
  
  if (Notification.permission === "granted") {
    showNativeNotification("Ujian Notifikasi", {
      body: state.lang==="ms"?"Ini adalah notifikasi ujian dari UFL Monitor.":"This is a test notification from UFL Monitor.",
      tag: "ufl-test"
    });
  } else if (Notification.permission !== "denied") {
    Notification.requestPermission().then(permission => {
      if (permission === "granted") {
        showNativeNotification("Ujian Notifikasi", {
          body: state.lang==="ms"?"Ini adalah notifikasi ujian dari UFL Monitor.":"This is a test notification from UFL Monitor.",
          tag: "ufl-test"
        });
      } else {
        alert(state.lang==="ms"?"Kebenaran notifikasi ditolak.":"Notification permission denied.");
      }
    });
  } else {
    alert(state.lang==="ms"?"Kebenaran notifikasi telah ditolak sebelum ini.":"Notification permission was previously denied.");
  }
}

 let rows=items.length?items.map(([u,d])=>{let ready=d.drip===READY||d.nonmed===READY,key=esc(u).replace(/'/g,"&#039;");return`<div class="unit-grid rounded-2xl p-3 border ${ready?"ready-card":""}" style="background:${c.bg};border-color:${ready?"#4ade80":c.border}"><div class="unit-data"><div class="flex items-center gap-3">${unitBadge(u)}<div class="unit-title"><div class="font-bold unit-title-name">${esc(unitName(u))}</div><div class="unit-full-name" style="background:${c.header};color:#fff">${esc(unitName(u))}</div><div class="text-xs mt-1" style="color:${c.muted}">${esc(u)} · ${t("unit")}</div></div><button class="speak-button" onclick="speakUnit('${key}')">🔊</button></div></div><div class="unit-data text-center" style="border-color:${c.accent}"><div class="column-label mb-2" style="color:${c.accent}">💧 ${t("drip")}</div>${badge(d.drip)}</div><div class="unit-data text-center" style="border-color:${c.purple}"><div class="column-label mb-2" style="color:${c.purple}">💉 ${t("nonmed")}</div>${badge(d.nonmed)}</div><div class="unit-data text-center" style="border-color:${c.green}"><div class="column-label" style="color:${c.green}">🛒 ${t("carts")}</div><div class="cart-number" style="color:${c.green}">${d.carts}</div></div><div class="unit-data text-center" style="border-color:${c.red}"><div class="column-label" style="color:${c.red}">🚚 ${t("need")}</div><div class="cart-status ${d.need?"blink-cart text-green-500":"text-rose-500"}">${d.need?"✓":"×"}</div></div></div>`}).join(""):`<div class="text-center py-16" style="color:${c.muted}">${t("noData")}</div>`;
 let notifModal=state.notifPrompt?`<div class="fixed inset-0 z-50 flex items-center justify-center p-4" style="background:rgba(0,0,0,.6);backdrop-filter:blur(2px)"><div class="rounded-3xl p-6 max-w-sm w-full border shadow-2xl" style="background:${c.surface};border-color:${c.border};color:${c.ink}"><div class="text-4xl mb-4 text-center">🔔</div><h3 class="text-xl font-bold text-center mb-2">${t("enableNotif")}</h3><p class="text-sm text-center mb-6" style="color:${c.muted}">${t("enableNotifBody")}</p><div class="flex gap-3"><button onclick="dismissNotifPrompt()" class="flex-1 py-3 rounded-xl font-bold border" style="border-color:${c.border};color:${c.muted}">${t("notifNotNow")}</button><button onclick="enableNotifPrompt()" class="flex-1 py-3 rounded-xl font-bold text-white bg-blue-500">${t("notifEnable")}</button></div></div></div>`:"";
 document.getElementById("app").innerHTML=`<div class="outer-frame"><header class="sticky top-0 z-40 border-b" style="background:${c.header};border-color:${c.border}"><div class="max-w-7xl mx-auto px-4 min-h-16 py-2 flex items-center justify-between gap-3"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-2xl flex items-center justify-center text-white font-black bg-gradient-to-br from-blue-400 to-violet-500">UFL</div><div><div class="flex items-center gap-2"><b class="text-white block" style="font-size:calc(1rem * var(--title-status-scale))">${t("title")}</b><div class="flex items-center gap-1"><button onclick="adjustTitleStatusScale(-0.1)" class="w-6 h-6 rounded-md flex items-center justify-center text-[10px] font-bold bg-white/20 text-white hover:bg-white/30">A-</button><button onclick="adjustTitleStatusScale(0.1)" class="w-6 h-6 rounded-md flex items-center justify-center text-[10px] font-bold bg-white/20 text-white hover:bg-white/30">A+</button></div></div><div class="text-xs text-slate-300">${t("tracker")}</div></div></div><div class="flex gap-2 items-center"><button onclick="setLanguage()" class="px-3 py-2 rounded-xl bg-white text-slate-900 font-black">${state.lang==="ms"?"EN":"BM"}</button><button onclick="toggleSound()" class="px-3 py-2 rounded-xl font-bold ${state.sound?"bg-cyan-300 text-cyan-950":"bg-slate-600 text-white"}">${state.sound?"🔊":"🔇"}</button><button onclick="toggleTheme()" class="px-3 py-2 rounded-xl" style="background:${c.surface}">${state.theme==="light"?"🌙":"☀️"}</button><button onclick="toggleSettings()" class="px-3 py-2 rounded-xl text-white font-bold bg-blue-500">⚙️</button></div></div></header><main class="max-w-7xl mx-auto px-4 py-6">${settings}<section class="rounded-3xl p-6 border shadow-sm mb-6" style="background:${c.surface};border-color:${c.border}"><div class="flex justify-between items-center gap-4"><div><h1 class="text-2xl font-extrabold" style="font-size:calc(1.5rem * var(--title-status-scale))">${t("dashboard")}</h1><p class="text-sm mt-1" style="color:${c.muted}">${t("last")}: ${state.lastUpdated.toLocaleString()}</p></div><button onclick="fetchData()" class="px-4 py-2 rounded-xl text-white font-bold bg-blue-500">↻ ${state.loading?t("refreshing"):t("refresh")}</button></div><div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4 mt-6">${[[t("total"),all.length,"📦","stat-total"],[t("ready"),count(READY),"✅","stat-ready"],[t("processing"),count(PROCESSING),"🕘","stat-processing"],[t("received"),count(RECEIVED),"📥","stat-received"]].map(x=>`<div class="rounded-2xl p-5 border" style="background:${c.bg};border-color:${c.border}"><div class="flex justify-between items-center"><div><div class="text-sm" style="color:${c.muted}">${x[0]}</div><div class="text-3xl font-extrabold mt-1">${x[1]}</div></div><div class="stat-icon ${x[3]}">${x[2]}</div></div></div>`).join("")}</div></section><section class="rounded-3xl p-6 border shadow-sm" style="background:${c.surface};border-color:${c.border}"><div class="flex flex-col sm:flex-row justify-between sm:items-center gap-4 mb-5"><h2 class="text-2xl font-extrabold" style="font-size:calc(1.5rem * var(--title-status-scale))">🔎 ${t("unitInden")}</h2><input value="${esc(state.search)}" oninput="setSearch(this.value)" placeholder="${t("search")}" class="rounded-2xl px-4 py-2 w-full sm:w-72" style="background:${c.input};color:${c.ink};border-color:${c.border}"></div><div class="unit-grid unit-header px-3 py-3 mb-3 text-xs font-bold uppercase" style="color:${c.muted}"><div>${t("unit")}</div><div class="text-center">${t("drip")}</div><div class="text-center">${t("nonmed")}</div><div class="text-center">${t("carts")}</div><div class="text-center">${t("need")}</div></div><div class="space-y-4">${rows}</div></section>${state.error?`<section class="rounded-3xl p-5 border mt-6" style="background:${c.redSoft};border-color:${c.red}"><b>⚠️ ${t("error")}</b><div>${esc(state.error)}</div></section>`:""}</main></div>${notifModal}`;

Object.assign(window,{fetchData,toggleTheme,toggleSettings,saveSettings,toggleSound,setLanguage,dismissToast,playSound,speakUnit,speakTest,setSearch,adjustFontScale,resetFontScale,updateFontScale,adjustTitleStatusScale,resetTitleStatusScale,updateTitleStatusScale,toggleNotifications,dismissNotifPrompt,enableNotifPrompt,testNativeNotification,state});

      const blob=new Blob([swCode],{type:'application/javascript'});

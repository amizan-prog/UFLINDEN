<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>UFL Inden Monitor</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;transition:.3s}
.outer-frame{min-height:100vh;border:10px solid #172033}
button,input,textarea,select{border-width:2px!important;transition:.2s}
button:hover{transform:translateY(-1px);filter:brightness(1.06)}
button:active{transform:translateY(0)}
.unit-grid{display:grid;grid-template-columns:1.2fr 1.15fr 1.25fr .85fr .85fr;gap:12px;align-items:stretch}
.unit-data{min-width:0;border:2px solid;border-radius:1rem;padding:12px;background:rgba(255,255,255,.35);display:flex;flex-direction:column;justify-content:center}
.status{font-weight:900;font-size:.78rem;line-height:1rem;overflow-wrap:anywhere;border:2px solid}
.current-status{animation:blinkStatus 1.15s ease-in-out infinite}
.cart-status{display:inline-flex;align-items:center;gap:5px;width:max-content;min-width:54px;justify-content:center;padding:4px 10px;border-radius:999px;font-weight:1000;font-size:1.2rem}
.cart-status.blink-cart{animation:blinkCart 1s ease-in-out infinite}
.cart-number{display:inline-block;font-size:1.35rem;font-weight:1000}
.unit-badge{width:3.2rem;height:3.2rem;display:inline-flex;align-items:center;justify-content:center;border-radius:1rem;font-size:1rem;font-weight:1000;letter-spacing:.02em;flex-shrink:0;border:2px solid;background:#dbeafe;color:#1e3a8a;border-color:#60a5fa;box-shadow:0 4px 0 #93c5fd}
.unit-badge.long{font-size:.68rem;line-height:.75rem;text-align:center;word-break:break-word;padding:4px}
.unit-badge.dark{background:#263752;color:#dbeafe;border-color:#4b6385;box-shadow:0 4px 0 #17233a}
.ready-card{position:relative;border:3px solid #4ade80!important;transform:translateY(-2px);box-shadow:0 0 0 3px #22c55e25,0 9px 0 #166534,0 15px 24px #22c55e30;animation:pulseGreen 2.5s ease-in-out infinite}
.ready-card:hover{transform:translateY(-6px)}
.ready-card:after{content:"✓ READY";position:absolute;top:-14px;right:18px;padding:3px 9px;border-radius:999px;color:#052e16;background:#bbf7d0;border:2px solid #4ade80;font-size:.62rem;font-weight:900}
.unit-title{position:relative;cursor:pointer;min-width:0}
.unit-title-name{border-bottom:2px dotted currentColor;overflow-wrap:anywhere}
.unit-full-name{display:none;position:absolute;z-index:20;left:0;top:calc(100% + 9px);min-width:220px;max-width:280px;padding:10px 12px;border-radius:12px;font-size:.78rem;line-height:1.25rem;font-weight:700;box-shadow:0 12px 28px #0004}
.unit-title:hover .unit-full-name,.unit-title.active .unit-full-name{display:block}
.stat-icon{width:3.2rem;height:3.2rem;display:flex;align-items:center;justify-content:center;border-radius:1rem;font-size:1.65rem;border:2px solid}
.stat-total{background:#e5e7eb;border-color:#9ca3af;box-shadow:inset 0 -4px 0 #9ca3af}
.stat-ready{background:#bbf7d0;border-color:#4ade80;box-shadow:inset 0 -4px 0 #16a34a}
.stat-processing{background:#fef08a;border-color:#f59e0b;box-shadow:inset 0 -4px 0 #ea580c}
.stat-received{background:#bfdbfe;border-color:#60a5fa;box-shadow:inset 0 -4px 0 #2563eb}
.toast-wrap{position:fixed;top:82px;right:24px;z-index:100;display:flex;flex-direction:column;gap:12px;width:min(390px,calc(100vw - 32px));pointer-events:none}
.toast{pointer-events:auto;position:relative;overflow:hidden;border:2px solid #facc15;border-left-width:6px;box-shadow:0 12px 30px #0003;animation:toastIn .35s ease both}
.flow{color:#94a3b8;font-weight:900}
.sound-active{animation:soundPulse 1s ease-in-out infinite}
@keyframes blinkStatus{0%,100%{opacity:1;transform:scale(1);box-shadow:0 0 0 0 transparent}50%{opacity:.28;transform:scale(.96);box-shadow:0 0 0 5px #38bdf855}}
@keyframes blinkCart{0%,100%{opacity:1;transform:scale(1);filter:brightness(1)}50%{opacity:.3;transform:scale(.86);filter:brightness(1.7)}}
@keyframes pulseGreen{0%,100%{box-shadow:0 0 0 3px #22c55e25,0 9px 0 #166534,0 15px 24px #22c55e30}50%{box-shadow:0 0 0 5px #22c55e45,0 11px 0 #14532d,0 20px 30px #22c55e4d}}
@keyframes toastIn{from{transform:translateX(35px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes soundPulse{50%{box-shadow:0 0 0 5px #22d3ee55}}
@media(max-width:1279px){.unit-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.unit-header{display:none}.unit-grid:not(.unit-header)>:first-child{grid-column:1/-1}}
@media(max-width:640px){.outer-frame{border-width:5px}.header-inner{padding-left:10px!important;padding-right:10px!important;gap:8px!important}.brand-title{font-size:.82rem}.header-actions{gap:5px!important;max-width:calc(100vw - 150px)}.header-actions button{padding:.4rem .55rem!important;font-size:.72rem}.units,.stats-card,.dashboard-card{padding:1rem!important}.dashboard-title{font-size:1rem!important}.unit-grid{gap:10px;padding:10px!important}.unit-data{padding:10px}.ready-card:after{right:12px;font-size:.55rem}.toast-wrap{top:70px;right:16px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body class="bg-slate-100 text-slate-900">
<div id="app"></div>
<div id="toastContainer" class="toast-wrap"></div>

<script>
const DEFAULT_SHEET_URL="https://docs.google.com/spreadsheets/d/1m6D6POkxoEGPr0n8X4N2xv3nC5j0rxvsML02tGkK1to/edit?gid=0#gid=0";
const READY="Sedia Diambil",PROCESSING="Sedang Diproses",RECEIVED="Baru Diterima",HIDDEN="Inden Belum Diterima";
const UNIT_NAMES={ICU:"Intensive Care Unit",W5A:"Wad 5A (LELAKI)",W6A:"Wad 6A (PEREMPUAN)",W6B:"Wad 6B",W7A:"Wad 7A (PEREMPUAN)",W7B:"Wad 7B (LELAKI)",ADM:"Unit Hasil",BOT:"Unit Brakiterapi",CSSD:"Unit Bekalan Steril",DCO:"Unit Rawatan Harian Onkologi",HNU:"Unit Rawatan Kanser Di Rumah",IFS:"Unit Kawalan Infeksi",GOT:"Dewan Bedah Am",PAT:"Unit Patologi",PHY:"Unit Fisiologi",TCM:"Unit Rawatan Tradisional dan Komplementari",IPC:"Unit Farmasi Pesakit Dalam",UKA:"Unit Kesihatan Awam",RKD:"Unit Rekod Perubatan",PPD:"Pusat Pengambilan Darah",W8A:"Wad 8A (LELAKI)",W8B:"Wad 8B (PEREMPUAN)",W9A:"Wad Multidisiplin 9A",W9B:"Wad Eksekutif 9B",DIET:"Unit Dietetik & Sajian",ED:"Unit Kecemasan",MOR:"Unit Mortuari/Forensik",MDC:"Klinik Multidisiplin",NM189:"Unit Perubatan Nuklear (Farmasi)",NMC:"Klinik Perubatan Nuklear",ONC:"Klinik Onkologi","PETCT(F)":"Farmasi PETCT",RADIO:"Radiologi",RTC:"Klinik Radioterapi",RTT:"Unit Rawatan Radioterapi",WRR:"Wad Radionuklik",OPC:"Unit Farmasi Luar","PETCT(N)":"PETCT (Nursing)"};
const TEXT={ms:{tracker:"Pengesan status semasa",settings:"Aturan",dashboard:"Papan Pemuka Status Inden",unitInden:"Unit Inden",last:"Terakhir dikemaskini",refresh:"Muat Semula",refreshing:"Mengemaskini...",total:"Jumlah Unit",ready:"Sedia",processing:"Proses",received:"Baru Diterima",units:"Unit",unit:"Unit",drip:"Drip",nonmed:"Bukan Ubat",carts:"Jumlah Troli",need:"Perlu Troli",sheet:"URL Google Sheet",save:"Simpan & Muatkan",error:"Ralat",noData:"Tiada data dimuatkan lagi.",noStatus:"Tiada status",sound:"Bunyi notifikasi",chime:"Chime",doorbell:"Doorbell",whistle:"Whistle",ring:"Ring",loop:"Bunyi berulang sehingga notifikasi ditutup"},en:{tracker:"Current status tracker",settings:"Settings",dashboard:"Indent Status Dashboard",unitInden:"Indent Units",last:"Last updated",refresh:"Refresh",refreshing:"Refreshing...",total:"Total Units",ready:"Ready",processing:"Processing",received:"Newly Received",units:"Units",unit:"Unit",drip:"Drip",nonmed:"Non-Medicine",carts:"Total Carts",need:"Carts Needed",sheet:"Google Sheet URL",save:"Save & Load",error:"Error",noData:"No data loaded yet.",noStatus:"No status",sound:"Notification sound",chime:"Chime",doorbell:"Doorbell",whistle:"Whistle",ring:"Ring",loop:"Sound repeats until notification is closed"}};
const LIGHT={bg:"#f8fafc",surface:"#fff",ink:"#0f172a",muted:"#64748b",border:"#e2e8f0",accent:"#2563eb",purple:"#7c3aed",green:"#16a34a",red:"#dc2626",redSoft:"#fee2e2",amber:"#d97706",input:"#fff",header:"#111827"};
const DARK={bg:"#111827",surface:"#1f2937",ink:"#f8fafc",muted:"#cbd5e1",border:"#475569",accent:"#60a5fa",purple:"#c4b5fd",green:"#4ade80",red:"#fb7185",redSoft:"#451a24",amber:"#fbbf24",input:"#172236",header:"#020617"};
const LEGACY={"Inden Sedia Diambil":READY,"Inden Sedang Diproses":PROCESSING,"Inden Baru Diterima":RECEIVED};
const state={units:{},previous:{},toasts:[],activeUnit:null,sheetUrl:localStorage.getItem("ufl-sheet-url")||DEFAULT_SHEET_URL,theme:localStorage.getItem("ufl-theme")||"light",lang:localStorage.getItem("ufl-lang")||"ms",sound:localStorage.getItem("ufl-sound")!=="off",soundType:localStorage.getItem("ufl-sound-type")||"chime",loading:false,error:"",lastUpdated:new Date(),settings:false};
let audioContext=null,soundLoop=null;
const t=k=>TEXT[state.lang][k]||k,colors=()=>state.theme==="dark"?DARK:LIGHT;
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const normalize=v=>LEGACY[String(v||"").trim()]||String(v||"").trim();
const valid=[READY,PROCESSING,RECEIVED,HIDDEN];
const unitName=u=>UNIT_NAMES[String(u).trim().toUpperCase()]||String(u).trim();
const label=s=>state.lang==="en"?(s===READY?"Ready":s===PROCESSING?"Processing":s===RECEIVED?"Newly Received":"Not Yet Received"):(s===READY?"Sedia Diambil":s===PROCESSING?"Diproses":s===RECEIVED?"Baru Diterima":"Belum Diterima");
const statusColor=s=>{let c=colors();return s===READY?c.green:s===PROCESSING?c.amber:s===RECEIVED?c.accent:c.muted};
const normalizeTroli=v=>["ya","yes","true","1","✓","✔"].includes(String(v??"").trim().toLowerCase())?"✓":"X";

function tone(freq,start,duration,type="sine",end=freq){
 if(!audioContext)return;
 const o=audioContext.createOscillator(),g=audioContext.createGain(),now=audioContext.currentTime+start;
 o.type=type;o.frequency.setValueAtTime(freq,now);o.frequency.linearRampToValueAtTime(end,now+duration);
 g.gain.setValueAtTime(.001,now);g.gain.exponentialRampToValueAtTime(.14,now+.025);g.gain.exponentialRampToValueAtTime(.001,now+duration);
 o.connect(g);g.connect(audioContext.destination);o.start(now);o.stop(now+duration+.03);
}
function playSound(){
 if(!state.sound)return;
 try{
  audioContext=audioContext||new(window.AudioContext||window.webkitAudioContext)();
  if(audioContext.state==="suspended")audioContext.resume();
  if(state.soundType==="doorbell"){tone(660,0,.35,"sine",520);tone(520,.38,.5,"sine",390)}
  else if(state.soundType==="whistle"){tone(900,0,.12,"triangle",1800);tone(1800,.13,.45,"triangle",1200)}
  else if(state.soundType==="ring"){tone(880,0,.22,"sine",880);tone(880,.28,.22,"sine",880);tone(880,.56,.22,"sine",880)}
  else{tone(660,0,.28,"sine",990);tone(990,.3,.42,"sine",1320)}
 }catch(e){}
}
function startSoundLoop(){
 if(!state.sound)return;
 playSound();
 clearInterval(soundLoop);
 soundLoop=setInterval(()=>{if(state.toasts.length&&state.sound)playSound();else stopSoundLoop()},1300);
}
function stopSoundLoop(){clearInterval(soundLoop);soundLoop=null}
function badge(s,blink=false){return s?`<span class="status ${blink&&s!==HIDDEN?"current-status":""} inline-flex items-center gap-1 px-2.5 py-1.5 rounded-xl" style="color:${s===READY?"#052e16":"#fff"};background:${s===READY?"#bbf7d0":statusColor(s)};border-color:${s===READY?"#86efac":statusColor(s)}">${s===READY?"✅ ":""}${esc(label(s))}</span>`:""}
function unitBadge(u){let x=String(u).trim().toUpperCase(),z=["CSSD","DIET","ED","NM189","PETCT(F)","PETCT(N)"].includes(x)?x:x.slice(0,3);return`<div class="unit-badge ${z.length>3?"long":""} ${state.theme==="dark"?"dark":""}" title="${esc(unitName(u))}">${esc(z)}</div>`}
function parseCSV(text){let rows=[],row=[],cell="",quote=false;for(let i=0;i<text.length;i++){let x=text[i];if(quote){if(x==='"'&&text[i+1]==='"'){cell+='"';i++}else if(x==='"')quote=false;else cell+=x}else if(x==='"')quote=true;else if(x===","){row.push(cell.trim());cell=""}else if(x==="\n"){row.push(cell.trim());rows.push(row);row=[];cell=""}else if(x!=="\r")cell+=x}if(cell||row.length){row.push(cell.trim());rows.push(row)}return rows}
function csvUrl(url){let m=String(url).match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);if(!m)return"";try{let p=new URL(url);return`https://docs.google.com/spreadsheets/d/${m[1]}/export?format=csv&gid=${p.searchParams.get("gid")||0}`}catch{return""}}
function toast(unit,cat,old,now){state.toasts.unshift({id:Date.now()+Math.random(),unit,cat,old,now,time:new Date().toLocaleTimeString()});state.toasts=state.toasts.slice(0,5);startSoundLoop();renderToasts()}
function renderToasts(){let c=colors();document.getElementById("toastContainer").innerHTML=state.toasts.map(n=>`<div class="toast rounded-2xl p-4 ${state.sound?"sound-active":""}" style="background:${c.surface};color:${c.ink}"><div class="flex justify-between"><b>🔔 ${esc(n.unit)}</b><button onclick="dismissToast('${n.id}')">×</button></div><div class="text-xs mt-2" style="color:${c.muted}">${n.cat==="drip"?"💧 "+t("drip"):"💉 "+t("nonmed")}</div><div class="flex flex-wrap items-center gap-1 mt-3">${badge(n.old)}<span class="flow">→</span>${badge(n.now)}</div><small style="color:${c.muted}">${n.time}</small></div>`).join("")}
function dismissToast(id){state.toasts=state.toasts.filter(x=>String(x.id)!==String(id));if(!state.toasts)stopSoundLoop();renderToasts()}
function toggleTheme(){state.theme=state.theme==="light"?"dark":"light";localStorage.setItem("ufl-theme",state.theme);render()}
function setLanguage(){state.lang=state.lang==="ms"?"en":"ms";localStorage.setItem("ufl-lang",state.lang);render()}
function toggleSound(){state.sound=!state.sound;localStorage.setItem("ufl-sound",state.sound?"on":"off");state.sound?startSoundLoop():stopSoundLoop();render()}
function changeSound(v){state.soundType=v;localStorage.setItem("ufl-sound-type",v);if(state.toasts.length)playSound();render()}
function toggleSettings(){state.settings=!state.settings;render()}
function toggleUnitInfo(id){state.activeUnit=state.activeUnit===id?null:id;render()}
function saveSettings(){state.sheetUrl=document.getElementById("sheetUrl").value.trim();localStorage.setItem("ufl-sheet-url",state.sheetUrl);state.settings=false;fetchData()}

async function fetchData(){
 if(state.loading)return;
 state.loading=true;state.error="";render();
 try{
  let r=await fetch(csvUrl(state.sheetUrl));if(!r.ok)throw Error("Gagal membaca Google Sheet.");
  let result={};
  parseCSV(await r.text()).forEach(a=>{let u=(a[0]||"").trim(),d=normalize(a[1]),n=normalize(a[2]);if(u&&u.toLowerCase()!=="unit"&&(valid.includes(d)||valid.includes(n)))result[u]={drip:{status:d},bukanUbat:{status:n},jumlahTroli:+a[3]||0,perluTroli:normalizeTroli(a[4])}});
  let current={};
  Object.entries(result).forEach(([u,d])=>["drip","bukanUbat"].forEach(cat=>{let now=normalize(d[cat].status)||HIDDEN,key=u+"-"+cat,old=state.previous[key];if(old!==undefined&&old!==now&&now!==HIDDEN)toast(u,cat,old,now);current[key]=now;d[cat].status=now}));
  state.previous=current;state.units=Object.fromEntries(Object.entries(result).filter(([,u])=>!(u.drip.status===HIDDEN&&u.bukanUbat.status===HIDDEN)));state.lastUpdated=new Date()
 }catch(e){state.error=e.message||"Ralat berlaku."}
 state.loading=false;render()
}

function render(){
 let c=colors(),items=Object.entries(state.units).sort(([a,x],[b,y])=>{let A=x.drip.status===READY||x.bukanUbat.status===READY,B=y.drip.status===READY||y.bukanUbat.status===READY;return A!==B?B-A:a.localeCompare(b,undefined,{numeric:true,sensitivity:"base"})}),total=items.length,count=s=>items.filter(([,u])=>u.drip.status===s||u.bukanUbat.status===s).length;
 let settings=state.settings?`<section class="rounded-3xl p-6 border" style="background:${c.surface};border-color:${c.border}"><div class="flex justify-between mb-4"><h3 class="font-bold text-lg">⚙️ ${t("settings")}</h3><button onclick="toggleSettings()">✕</button></div><label class="text-sm font-semibold">${t("sheet")}</label><textarea id="sheetUrl" rows="3" class="w-full mt-2 rounded-2xl px-4 py-3" style="background:${c.input};color:${c.ink};border-color:${c.border}">${esc(state.sheetUrl)}</textarea><label class="block text-sm font-semibold mt-5">${t("sound")}</label><select onchange="changeSound(this.value)" class="w-full mt-2 rounded-2xl px-4 py-3" style="background:${c.input};color:${c.ink};border-color:${c.border}"><option value="chime" ${state.soundType==="chime"?"selected":""}>🔔 ${t("chime")}</option><option value="doorbell" ${state.soundType==="doorbell"?"selected":""}>🚪 ${t("doorbell")}</option><option value="whistle" ${state.soundType==="whistle"?"selected":""}>📣 ${t("whistle")}</option><option value="ring" ${state.soundType==="ring"?"selected":""}>☎️ ${t("ring")}</option></select><p class="text-xs mt-2" style="color:${c.muted}">${t("loop")}</p><button onclick="toggleSound()" class="mt-3 px-4 py-2 rounded-xl font-bold ${state.sound?"bg-cyan-300 text-cyan-950":"bg-slate-600 text-white"}">${state.sound?"🔊":"🔇"} ${state.sound?"On":"Off"}</button><button onclick="playSound()" class="mt-3 ml-2 px-4 py-2 rounded-xl font-bold bg-violet-500 text-white">▶ Test</button><button onclick="saveSettings()" class="w-full mt-4 px-4 py-3 rounded-2xl text-white font-bold bg-blue-500">${t("save")}</button></section>`:"";
 let rows=items.length?items.map(([u,d])=>{let ready=d.drip.status===READY||d.bukanUbat.status===READY,active=state.activeUnit===u,tick=d.perluTroli==="✓",name=unitName(u);return`<div class="unit-grid rounded-2xl p-3 border ${ready?"ready-card":""}" style="background:${c.bg};border-color:${ready?"#4ade80":c.border}"><div class="unit-data"><div class="flex items-center gap-3">${unitBadge(u)}<div class="unit-title ${active?"active":""}" onclick="toggleUnitInfo(${JSON.stringify(u)})"><div class="font-bold break-words unit-title-name">${esc(name)}</div><div class="unit-full-name" style="background:${c.header};color:#fff;border-color:${c.accent}">${esc(name)}</div><div class="text-xs mt-1" style="color:${c.muted}">${esc(u)} · ${t("unit")} ${t("unitInden")}</div></div></div></div><div class="unit-data" style="border-color:${c.accent}"><div class="text-xs font-bold mb-2" style="color:${c.accent}">💧 ${t("drip")}</div>${badge(d.drip.status,true)||`<span style="color:${c.muted}">${t("noStatus")}</span>`}</div><div class="unit-data" style="border-color:${c.purple}"><div class="text-xs font-bold mb-2" style="color:${c.purple}">💉 ${t("nonmed")}</div>${badge(d.bukanUbat.status,true)||`<span style="color:${c.muted}">${t("noStatus")}</span>`}</div><div class="unit-data" style="border-color:${c.green}"><div class="text-xs font-bold" style="color:${c.green}">🛒 ${t("carts")}</div><div class="cart-number" style="color:${c.green}">${d.jumlahTroli||0}</div></div><div class="unit-data" style="border-color:${c.red}"><div class="text-xs font-bold" style="color:${c.red}">🚚 ${t("need")}</div><div class="cart-status ${tick?"blink-cart text-green-500":"text-rose-500"}">${tick?"✓":"×"}</div></div></div>`}).join(""):`<div class="text-center py-16" style="color:${c.muted}">${t("noData")}</div>`;
 let stats=[[t("total"),total,"📦","stat-total"],[t("ready"),count(READY),"✅","stat-ready"],[t("processing"),count(PROCESSING),"🕘","stat-processing"],[t("received"),count(RECEIVED),"📥","stat-received"]];
 document.body.style.background=c.bg;document.body.style.color=c.ink;

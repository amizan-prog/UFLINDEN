<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>UFL Inden Monitor</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--scale:1;--title:1}
html{font-size:calc(16px * var(--scale));scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;transition:.25s}
button,input,textarea,select{border-width:2px!important;transition:.2s}
button:hover{transform:translateY(-1px);filter:brightness(1.06)}
.frame{min-height:100vh;border:9px solid #172033}
.grid-unit{display:grid;grid-template-columns:1.25fr 1.15fr 1.25fr .8fr .8fr;gap:12px}
.box{min-width:0;border:2px solid;border-radius:1rem;padding:12px;background:#ffffff55}
.status{display:flex;justify-content:center;align-items:center;min-height:32px;text-align:center;font-weight:900;line-height:1rem;overflow-wrap:anywhere;border:2px solid;padding:5px 8px;border-radius:10px;font-size:calc(.78rem * var(--title))}
.blink{animation:blink 1.2s ease-in-out infinite}
.cart{font-size:1.3rem;font-weight:1000;text-align:center}
.cart.blink{animation:cartBlink 1s ease-in-out infinite}
.badge{width:3.2rem;height:3.2rem;display:flex;align-items:center;justify-content:center;border-radius:1rem;font-weight:1000;border:2px solid;background:#dbeafe;color:#1e3a8a;border-color:#60a5fa;box-shadow:0 4px 0 #93c5fd;flex-shrink:0}
.badge.long{font-size:.65rem;line-height:.75rem;text-align:center;padding:4px}
.ready{position:relative;border:3px solid #4ade80!important;box-shadow:0 9px 0 #166534,0 15px 24px #22c55e30;animation:pulse 2.5s infinite}
.ready:after{content:"✓ READY";position:absolute;right:18px;top:-14px;padding:3px 9px;border-radius:99px;background:#bbf7d0;color:#052e16;border:2px solid #4ade80;font-size:.6rem;font-weight:900}
.speak{width:38px;height:38px;border-radius:12px;background:#dbeafe;color:#1d4ed8;border:2px solid #60a5fa}
.toast{animation:toast .35s ease both;border:2px solid #facc15;border-left-width:6px;box-shadow:0 12px 30px #0003}
@keyframes blink{50%{opacity:.3;transform:scale(.96);box-shadow:0 0 0 5px #38bdf855}}
@keyframes cartBlink{50%{opacity:.3;transform:scale(.86)}}
@keyframes pulse{50%{box-shadow:0 11px 0 #14532d,0 20px 30px #22c55e4d}}
@keyframes toast{from{transform:translateX(30px);opacity:0}to{transform:translateX(0);opacity:1}}
@media(max-width:1279px){.grid-unit{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-head{display:none}.grid-unit:not(.grid-head)>:first-child{grid-column:1/-1}}
@media(max-width:640px){.frame{border-width:5px}.grid-unit{gap:9px;padding:9px!important}.box{padding:10px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts" class="fixed top-20 right-5 z-50 flex flex-col gap-3 w-[min(390px,calc(100vw-32px))]"></div>

<script>
const DEFAULT_SHEET="https://docs.google.com/spreadsheets/d/1m6D6POkxoEGPr0n8X4N2xv3nC5j0rxvsML02tGkK1to/edit?gid=0#gid=0";
const READY="Sedia Diambil",PROCESSING="Sedang Diproses",RECEIVED="Baru Diterima",HIDDEN="Inden Belum Diterima";
const N={ICU:"Unit Rawatan Rapi",W5A:"Wad 5A (LELAKI)",W6A:"Wad 6A (PEREMPUAN)",W6B:"Wad 6B",W7A:"Wad 7A (PEREMPUAN)",W7B:"Wad 7B (LELAKI)",ADM:"Unit Hasil",BOT:"Unit Brakiterapi",CSSD:"Unit Bekalan Steril",DCO:"Unit Rawatan Harian Onkologi",HNU:"Unit Rawatan Kanser Di Rumah",IFS:"Unit Kawalan Infeksi",GOT:"Dewan Bedah Am",PAT:"Unit Patologi",PHY:"Unit Fisiologi",TCM:"Unit Rawatan Tradisional dan Komplementari",IPC:"Unit Farmasi Pesakit Dalam",UKA:"Unit Kesihatan Awam",RKD:"Unit Rekod Perubatan",PPD:"Pusat Pengambilan Darah",W8A:"Wad 8A (LELAKI)",W8B:"Wad 8B (PEREMPUAN)",W9A:"Wad Multidisiplin 9A",W9B:"Wad Eksekutif 9B",DIET:"Unit Dietetik & Sajian",ED:"Unit Kecemasan",MOR:"Unit Mortuari/Forensik",MDC:"Klinik Multidisiplin",NM189:"Unit Perubatan Nuklear (Farmasi)",NMC:"Klinik Perubatan Nuklear",ONC:"Klinik Onkologi","PETCT(F)":"Farmasi PETCT",RADIO:"Radiologi",RTC:"Klinik Radioterapi",RTT:"Unit Rawatan Radioterapi",WRR:"Wad Radionuklik",OPC:"Unit Farmasi Luar","PETCT(N)":"PETCT (Nursing)"};
const L={ms:{title:"UFL Inden Monitor",sub:"Pengesan status semasa",dash:"Papan Pemuka Status Inden",units:"Unit Inden",unit:"Unit",last:"Terakhir dikemaskini",refresh:"Muat Semula",loading:"Mengemaskini...",total:"Jumlah Unit",ready:"Sedia",processing:"Proses",received:"Baru Diterima",drip:"Drip",nonmed:"Bukan Ubat",carts:"Jumlah Troli",need:"Perlu Troli",search:"Cari unit...",settings:"Aturan",sheet:"URL Google Sheet",save:"Simpan & Muatkan",sound:"Bunyi notifikasi",on:"Hidup",off:"Tutup",test:"Uji Bunyi",voice:"Suara Google Bahasa Indonesia",testVoice:"Uji Teks Suara",placeholder:"Taip teks untuk diuji...",notifications:"Notifikasi OS",notifDesc:"Tunjuk notifikasi sistem apabila status berubah.",testNotif:"Uji Notifikasi",error:"Ralat",noData:"Tiada data dimuatkan lagi.",prefix:"status semasa untuk",resize:"Saiz Teks"},en:{title:"UFL Indent Monitor",sub:"Current status tracker",dash:"Indent Status Dashboard",units:"Indent Units",unit:"Unit",last:"Last updated",refresh:"Refresh",loading:"Refreshing...",total:"Total Units",ready:"Ready",processing:"Processing",received:"Newly Received",drip:"Drip",nonmed:"Non-Medicine",carts:"Total Carts",need:"Carts Needed",search:"Search unit...",settings:"Settings",sheet:"Google Sheet URL",save:"Save & Load",sound:"Notification sound",on:"On",off:"Off",test:"Test Sound",voice:"Google UK English voice",testVoice:"Test Voice Text",placeholder:"Type text to test...",notifications:"OS Notifications",notifDesc:"Show system notifications when status changes.",testNotif:"Test Notifications",error:"Error",noData:"No data loaded yet.",prefix:"current status for",resize:"Text Size"}};
const legacy={"Inden Sedia Diambil":READY,"Inden Sedang Diproses":PROCESSING,"Inden Baru Diterima":RECEIVED};
const s={units:{},old:{},lang:localStorage.lang||"ms",dark:localStorage.dark==="1",sound:localStorage.sound!=="0",notifications:localStorage.notifications==="1",settings:false,search:"",url:localStorage.sheet||DEFAULT_SHEET,font:+localStorage.font||1,title:+localStorage.title||1,last:new Date(),error:"",test:localStorage.test||"Ini ialah ujian suara Google Bahasa Indonesia.",loading:false};
const t=k=>L[s.lang][k]||k,esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m])),name=u=>N[u.toUpperCase()]||u;
const normalize=x=>legacy[String(x??"").trim()]||String(x??"").trim();
const C=()=>s.dark?{bg:"#111827",surface:"#1f2937",ink:"#f8fafc",muted:"#cbd5e1",border:"#475569",input:"#172236",header:"#020617",blue:"#60a5fa",green:"#4ade80",red:"#fb7185",amber:"#fbbf24"}:{bg:"#f8fafc",surface:"#fff",ink:"#0f172a",muted:"#64748b",border:"#e2e8f0",input:"#fff",header:"#111827",blue:"#2563eb",green:"#16a34a",red:"#dc2626",amber:"#d97706"};
const label=x=>s.lang==="en"?(x===READY?"Ready":x===PROCESSING?"Processing":x===RECEIVED?"Newly Received":"Not Yet Received"):(x===READY?"Sedia Diambil":x===PROCESSING?"Diproses":x===RECEIVED?"Baru Diterima":"Belum Diterima");
const status=x=>{let c=C(),col=x===READY?c.green:x===PROCESSING?c.amber:x===RECEIVED?c.blue:c.muted;return`<span class="status ${x!==HIDDEN?"blink":""}" style="background:${x===READY?"#bbf7d0":col};color:${x===READY?"#052e16":"#fff"};border-color:${col}">${x===READY?"✅ ":""}${esc(label(x))}</span>`};
function csvUrl(x){let m=x.match(/\/spreadsheets\/d\/([\w-]+)/);if(!m)return"";try{let u=new URL(x);return`https://docs.google.com/spreadsheets/d/${m[1]}/export?format=csv&gid=${u.searchParams.get("gid")||0}`}catch{return""}}
function csv(x){let a=[],r=[],v="",q=0;for(let i=0;i<x.length;i++){let c=x[i];if(q){if(c=='"'&&x[i+1]=='"'){v+='"';i++}else if(c=='"')q=0;else v+=c}else if(c=='"')q=1;else if(c==","){r.push(v.trim());v=""}else if(c=="\n"){r.push(v.trim());a.push(r);r=[];v=""}else if(c!="\r")v+=c}if(v||r.length){r.push(v.trim());a.push(r)}return a}
async function load(){if(s.loading)return;s.loading=true;s.error="";render();try{let r=await fetch(csvUrl(s.url));if(!r.ok)throw Error(t("error"));let out={},valid=[READY,PROCESSING,RECEIVED,HIDDEN];csv(await r.text()).forEach(r=>{let u=(r[0]||"").trim(),d=normalize(r[1]),n=normalize(r[2]);if(!u||u.toLowerCase()=="unit"||(!valid.includes(d)&&!valid.includes(n)))return;out[u]??={drip:HIDDEN,nonmed:HIDDEN,carts:0,need:false};if(valid.includes(d))out[u].drip=d;if(valid.includes(n))out[u].nonmed=n;out[u].carts||=+r[3]||0;out[u].need=["ya","yes","true","1","✓","✔"].includes((r[4]||"").toLowerCase())});Object.entries(out).forEach(([u,d])=>["drip","nonmed"].forEach(k=>{let key=u+k;if(s.old[key]&&s.old[key]!=d[k]&&d[k]!=HIDDEN)toast(u,s.old[key],d[k]);s.old[key]=d[k]}));s.units=out;s.last=new Date()}catch(e){s.error=e.message||t("error")}s.loading=false;render()}
function toast(u,a,b){let el=document.createElement("div");el.className="toast rounded-2xl p-4";let c=C();el.style=`background:${c.surface};color:${c.ink}`;el.innerHTML=`<div class="flex justify-between font-bold">🔔 ${esc(name(u))}<button onclick="this.parentElement.parentElement.remove()">×</button></div><div class="flex gap-1 items-center mt-3">${status(a)}<b>→</b>${status(b)}</div>`;document.getElementById("toasts").prepend(el);if(s.sound)beep();if(s.notifications&&Notification.permission==="granted")new Notification(name(u),{body:`${t("drip")}: ${label(b)}`})}
let ctx;function beep(){try{ctx??=new AudioContext;let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=880;g.gain.value=.12;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.35)}catch{}}
function speak(text){if(!speechSynthesis)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang=s.lang==="ms"?"id-ID":"en-GB";u.rate=.9;speechSynthesis.speak(u)}
function speakUnit(u){let d=s.units[u];speak(`${t("prefix")} ${name(u)}. ${t("drip")}: ${label(d.drip)}. ${t("nonmed")}: ${label(d.nonmed)}. ${t("carts")}: ${d.carts}.`)}
function resizeText(){s.font=s.font>=1.3?.9: +(s.font+.1).toFixed(1);localStorage.font=s.font;render()}
function settings(){let c=C();return s.settings?`<section class="rounded-3xl p-6 border mb-6" style="background:${c.surface};border-color:${c.border}"><div class="flex justify-between mb-4"><h2 class="text-xl font-bold">⚙️ ${t("settings")}</h2><button onclick="s.settings=false;render()">✕</button></div><label class="font-semibold">${t("sheet")}</label><textarea id="sheet" rows="3" class="w-full rounded-2xl p-3 mt-2" style="background:${c.input};color:${c.ink};border-color:${c.border}">${esc(s.url)}</textarea><div class="border rounded-2xl p-4 mt-5" style="border-color:${c.border}"><div class="flex justify-between items-center"><b>🔊 ${t("sound")}</b><button onclick="s.sound=!s.sound;localStorage.sound=s.sound?'1':'0';render()" class="px-4 py-2 rounded-xl font-bold ${s.sound?"bg-cyan-300":"bg-slate-600 text-white"}">${s.sound?t("on"):t("off")}</button></div><button onclick="beep()" class="w-full mt-3 rounded-xl bg-violet-500 text-white font-bold p-2">▶ ${t("test")}</button></div><div class="border rounded-2xl p-4 mt-5" style="border-color:${c.border}"><b>🔈 ${t("voice")}</b><input id="voice" value="${esc(s.test)}" placeholder="${t("placeholder")}" class="w-full rounded-xl p-3 mt-3" style="background:${c.input};color:${c.ink};border-color:${c.border}"><button onclick="s.test=document.getElementById('voice').value;localStorage.test=s.test;speak(s.test)" class="w-full mt-3 rounded-xl bg-emerald-500 text-white font-bold p-3">🔊 ${t("testVoice")}</button></div><div class="border rounded-2xl p-4 mt-5" style="border-color:${c.border}"><div class="flex justify-between items-center"><b>🖥️ ${t("notifications")}</b><button onclick="notify()" class="px-4 py-2 rounded-xl font-bold ${s.notifications?"bg-green-500 text-white":"bg-slate-600 text-white"}">${s.notifications?t("on"):t("off")}</button></div><p class="text-xs mt-2" style="color:${c.muted}">${t("notifDesc")}</p><button onclick="notify(true)" class="w-full mt-3 rounded-xl bg-amber-500 text-white font-bold p-2">🔔 ${t("testNotif")}</button></div><button onclick="s.url=document.getElementById('sheet').value;localStorage.sheet=s.url;s.settings=false;load()" class="w-full mt-5 rounded-2xl bg-blue-500 text-white font-bold p-3">${t("save")}</button></section>`:""}
async function notify(test=false){if(!("Notification"in window))return alert("Notifications are not supported.");let p=await Notification.requestPermission();s.notifications=p==="granted";localStorage.notifications=s.notifications?"1":"0";if(test&&s.notifications)new Notification("UFL Monitor",{body:"UFL notification test"});render()}
function render(){let c=C();document.documentElement.style.setProperty("--scale",s.font);document.documentElement.style.setProperty("--title",s.title);let all=Object.entries(s.units).filter(([u])=>u.toLowerCase().includes(s.search.toLowerCase())||name(u).toLowerCase().includes(s.search.toLowerCase()));let count=x=>Object.values(s.units).filter(d=>d.drip===x||d.nonmed===x).length;let rows=all.map(([u,d])=>{let ready=d.drip===READY||d.nonmed===READY;let z=u.toUpperCase(),b=["CSSD","DIET","ED","NM189","PETCT(F)","PETCT(N)"].includes(z)?z:z.slice(0,3);return`<div class="grid-unit rounded-2xl p-3 border ${ready?"ready":""}" style="background:${c.bg};border-color:${ready?"#4ade80":c.border}"><div class="box"><div class="flex items-center gap-3"><div class="badge ${b.length>3?"long":""}">${esc(b)}</div><div class="min-w-0 flex-1"><b class="break-words">${esc(name(u))}</b><small class="block" style="color:${c.muted}">${esc(u)} · ${t("unit")}</small></div><button class="speak" onclick="speakUnit('${esc(u)}')">🔊</button></div></div><div class="box text-center" style="border-color:${c.blue}"><small>💧 ${t("drip")}</small>${status(d.drip)}</div><div class="box text-center" style="border-color:#a78bfa"><small>💉 ${t("nonmed")}</small>${status(d.nonmed)}</div><div class="box text-center" style="border-color:${c.green}"><small>🛒 ${t("carts")}</small><div class="cart" style="color:${c.green}">${d.carts}</div></div><div class="box text-center" style="border-color:${c.red}"><small>🚚 ${t("need")}</small><div class="cart ${d.need?"blink text-green-500":"text-rose-500"}">${d.need?"✓":"×"}</div></div></div>`}).join("")||`<div class="text-center py-16" style="color:${c.muted}">${t("noData")}</div>`;
document.getElementById("app").innerHTML=`<div class="frame" style="background:${c.bg};color:${c.ink}"><header class="sticky top-0 z-40" style="background:${c.header}"><div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center"><div class="flex gap-3 items-center"><div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-blue-400 to-violet-500 flex items-center justify-center text-white font-black">UFL</div><div><b class="text-white">${t("title")}</b><small class="block text-slate-300">${t("sub")}</small></div></div><div class="flex gap-2 items-center"><div class="flex flex-col gap-1"><button onclick="s.lang=s.lang==='ms'?'en':'ms';localStorage.lang=s.lang;render()" class="rounded-xl bg-white px-3 py-2 font-black">${s.lang==="ms"?"EN":"BM"}</button><button onclick="resizeText()" title="${t("resize")}" class="rounded-xl bg-fuchsia-400 text-white px-3 py-1 text-sm font-bold">A↕</button></div><button onclick="s.sound=!s.sound;localStorage.sound=s.sound?'1':'0';render()" title="${t("sound")}" class="rounded-xl px-3 py-2 ${s.sound?"bg-cyan-300":"bg-slate-600 text-white"}">${s.sound?"🔊":"🔇"}</button><button onclick="s.dark=!s.dark;localStorage.dark=s.dark?'1':'0';render()" title="Dark / Light" class="rounded-xl bg-white/20 px-3 py-2">${s.dark?"☀️":"🌙"}</button><button onclick="s.settings=!s.settings;render()" title="${t("settings")}" class="rounded-xl bg-blue-500 text-white px-3 py-2">⚙️</button></div></div></header><main class="max-w-7xl mx-auto px-4 py-6">${settings()}<section class="rounded-3xl p-6 border mb-6 shadow-sm" style="background:${c.surface};border-color:${c.border}"><div class="flex justify-between gap-4 items-center"><div><h1 class="text-2xl font-extrabold">${t("dash")}</h1><p class="text-sm" style="color:${c.muted}">${t("last")}: ${s.last.toLocaleString()}</p></div><button onclick="load()" class="rounded-xl bg-blue-500 text-white font-bold px-4 py-2">↻ ${s.loading?t("loading"):t("refresh")}</button></div><div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4 mt-6">${[[t("total"),Object.keys(s.units).length,"📦"],[t("ready"),count(READY),"✅"],[t("processing"),count(PROCESSING),"🕘"],[t("received"),count(RECEIVED),"📥"]].map(x=>`<div class="rounded-2xl p-5 border" style="background:${c.bg};border-color:${c.border}"><div class="text-sm" style="color:${c.muted}">${x[0]}</div><div class="flex justify-between items-center"><strong class="text-3xl">${x[1]}</strong><span class="text-3xl">${x[2]}</span></div></div>`).join("")}</div></section><section class="rounded-3xl p-6 border shadow-sm" style="background:${c.surface};border-color:${c.border}"><div class="flex justify-between items-center gap-4 mb-5"><h2 class="text-2xl font-extrabold">🔎 ${t("units")}</h2><input oninput="s.search=this.value;render()" value="${esc(s.search)}" placeholder="${t("search")}" class="rounded-2xl px-4 py-2 w-full sm:w-72" style="background:${c.input};color:${c.ink};border-color:${c.border}"></div><div class="grid-unit grid-head px-3 py-3 mb-3 text-xs font-bold uppercase" style="color:${c.muted}"><div>${t("unit")}</div><div class="text-center">${t("drip")}</div><div class="text-center">${t("nonmed")}</div><div class="text-center">${t("carts")}</div><div class="text-center">${t("need")}</div></div><div class="space-y-4">${rows}</div></section>${s.error?`<div class="mt-5 rounded-2xl p-4 bg-rose-100 text-rose-800">⚠️ <b>${t("error")}:</b> ${esc(s.error)}</div>`:""}</main></div>`}
render();load();setInterval(load,5000);
</script>
</body>
</html>
